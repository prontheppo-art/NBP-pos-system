  ========================================================================
  [File Note]
  - File Name: report_index.html
  - Description: ศูนย์รวมเมนูรายงานการขาย (สำหรับ Admin)
  - External Libraries (CDNs):
    1. Supabase JS SDK v2 (https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)
    2. Tailwind CSS (https://cdn.tailwindcss.com)
  - Linked Local Files:
    1. supabaseClient.js (ไฟล์สำหรับเชื่อมต่อ Supabase Database Initialization)
  - Target Destination Pages:
    1. reportdaily.html (รายงานยอดขายรายวัน)
    2. reportgroupsales.html (รายงานยอดขายแยกตามกลุ่ม)
    3. reportsales.html (รายงานสรุปการขายรวม)
    4. index.html (หน้าหลักของระบบ)
  ========================================================================

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ศูนย์รวมรายงานการขาย - ลาบหนองบัวลำภู</title>
    <!-- Supabase JS Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ดึงการเชื่อมต่อ Supabase จากไฟล์ supabaseClient.js (ข้อ 1) -->
    <script src="supabaseClient.js"></script>

    <style>
      :root {
        --bg-color: #f8fafc;
      }

      /* ข้อ 2: เปิดให้ Scroll ได้ (pan-y) และป้องกันการซูม */
      html, body {
        min-height: 100%;
        margin: 0;
        padding: 0;
        font-family: 'Sarabun', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        touch-action: pan-y;
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
      }

      .app-layout {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        box-sizing: border-box;
        padding: 20px 16px 16px 16px;
        position: relative;
      }

      /* ข้อ 4: ล็อคส่วนหัว (Sticky Top) */
      .header-section {
        position: sticky;
        top: 0;
        background-color: #ffffff;
        z-index: 20;
        flex-shrink: 0;
      }

      .content-section {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1rem;
        flex: 1;
        min-height: 0;
        -webkit-overflow-scrolling: touch;
      }

      /* ข้อ 4: ล็อคส่วนท้าย (Sticky Bottom) */
      .footer-section {
        position: sticky;
        bottom: 0;
        background-color: #ffffff;
        z-index: 20;
        flex-shrink: 0;
      }

      ::-webkit-scrollbar {
        display: none;
      }
    </style>
</head>
<body class="bg-slate-100 flex items-start justify-center antialiased">

    <div class="w-full bg-white rounded-3xl shadow-2xl app-layout border border-slate-100">
        
        <!-- ส่วนหัว (Header - Sticky Top - ข้อ 4) -->
        <div class="header-section text-center pt-2 pb-4 border-b border-slate-100">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl shadow-xs">
                📊
            </div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">รายงานการขาย</h1>
            <p class="text-xs font-bold text-amber-600 mt-1">ร้านลาบหนองบัวลำภู</p>
        </div>
        
        <!-- ส่วนปุ่มเลือกรายงานทั้ง 3 รายการ (Content - Scrollable Area) -->
        <div class="content-section py-4">
            
            <!-- ปุ่ม 1: รายงานยอดขายประจำวัน -->
            <a href="reportdaily.html" class="group bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white p-4 rounded-2xl shadow-md hover:shadow-lg transition-all transform active:scale-95 flex items-center justify-between no-underline cursor-pointer">
                <div class="flex items-center gap-3.5">
                    <div class="w-11 h-11 bg-white/20 backdrop-blur-xs rounded-xl flex items-center justify-center text-xl shrink-0">
                        📅
                    </div>
                    <div class="text-left">
                        <div class="font-black text-sm tracking-wide">รายงานยอดขายรายวัน</div>
                        <div class="text-[11px] text-blue-100 font-medium">reportdaily.html</div>
                    </div>
                </div>
                <span class="text-white/70 group-hover:translate-x-1 transition-transform text-lg">➔</span>
            </a>

            <!-- ปุ่ม 2: รายงานยอดขายตามหมวดหมู่ -->
            <a href="reportgroupsales.html" class="group bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white p-4 rounded-2xl shadow-md hover:shadow-lg transition-all transform active:scale-95 flex items-center justify-between no-underline cursor-pointer">
                <div class="flex items-center gap-3.5">
                    <div class="w-11 h-11 bg-white/20 backdrop-blur-xs rounded-xl flex items-center justify-center text-xl shrink-0">
                        📂
                    </div>
                    <div class="text-left">
                        <div class="font-black text-sm tracking-wide">รายงานยอดขายแยกตามกลุ่ม</div>
                        <div class="text-[11px] text-emerald-100 font-medium">reportgroupsales.html</div>
                    </div>
                </div>
                <span class="text-white/70 group-hover:translate-x-1 transition-transform text-lg">➔</span>
            </a>

            <!-- ปุ่ม 3: รายงานสรุปภาพรวมการขาย -->
            <a href="reportsales.html" class="group bg-gradient-to-r from-purple-500 to-violet-600 hover:from-purple-600 hover:to-violet-700 text-white p-4 rounded-2xl shadow-md hover:shadow-lg transition-all transform active:scale-95 flex items-center justify-between no-underline cursor-pointer">
                <div class="flex items-center gap-3.5">
                    <div class="w-11 h-11 bg-white/20 backdrop-blur-xs rounded-xl flex items-center justify-center text-xl shrink-0">
                        📈
                    </div>
                    <div class="text-left">
                        <div class="font-black text-sm tracking-wide">รายงานสรุปการขายรวม</div>
                        <div class="text-[11px] text-purple-100 font-medium">reportsales.html</div>
                    </div>
                </div>
                <span class="text-white/70 group-hover:translate-x-1 transition-transform text-lg">➔</span>
            </a>

        </div>

        <!-- ปุ่มกลับหน้าหลัก (Footer - Sticky Bottom - ข้อ 4) -->
        <div class="footer-section pt-3 border-t border-slate-100">
            <a href="index.html" class="w-full bg-slate-700 hover:bg-slate-800 active:scale-95 text-white font-bold py-3 rounded-2xl text-xs text-center transition flex items-center justify-center gap-1.5 shadow-md no-underline cursor-pointer">
                🏠 กลับหน้าหลัก (Index)
            </a>
        </div>

    </div>

    <!-- JavaScript Logic (ข้อ 2: ป้องกัน Gesture Zoom) -->
    <script>
        // ป้องกัน Gesture Pinch-to-zoom และ Double-tap zoom บนอุปกรณ์พกพา
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>

</body>
</html>
