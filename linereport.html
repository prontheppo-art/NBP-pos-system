<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าระบบแจ้งเตือนรายงาน LINE</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
        }
        .section {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            background: #fafbfc;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #06C755; /* สีเขียว LINE */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #05b34c;
        }
        .back-btn {
            background-color: #d9534f;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

<div class="container">
    <button class="back-btn" onclick="history.back()">⬅️️ กลับหน้าผู้ดูแลระบบ</button>
    <h2>⚙️ ตั้งค่ารายงาน LINE</h2>

    <!-- ส่วนที่ 1: สถานะระบบเชื่อมต่อ -->
    <div class="section">
        <label>สถานะระบบแจ้งเตือน LINE OA</label>
        <p style="color: #06C755; font-weight: bold;">🟢 เชื่อมต่อระบบส่งอัตโนมัติเรียบร้อยแล้ว</p>
        <p style="font-size: 14px; color: #666;">ระบบจะส่งรายงานสรุปยอดขายเข้าห้องแชทของร้าน "ลาบหนองบัวลำภู" โดยตรงทันที</p>
    </div>

    <!-- ส่วนที่ 2: ข้อมูลสรุปยอดขายประจำวัน -->
    <div class="section">
        <label>ข้อมูลสรุปยอดขาย "ประจำวันนี้"</label>
        <textarea id="reportSummary" rows="4" readonly>กำลังโหลดข้อมูลยอดขาย...</textarea>
        
        <!-- ปุ่มกดส่งรายงานเข้า LINE -->
        <button onclick="sendReportToLine()">🚀 ส่งรายงานยอดขายเข้า LINE ทันที</button>
    </div>
</div>

<script>
    // ข้อมูลยอดขายประจำวัน
    const currentSalesData = {
        totalSales: 60,       
        totalOrders: 1,       
        reportDate: "30 กันยายน 2569"
    };

    // แสดงผลข้อมูลลงในกล่องข้อความตอนเปิดหน้าเว็บ
    window.onload = function() {
        const summaryText = `📊 รายงานยอดขายประจำวัน\n📅 วันที่: ${currentSalesData.reportDate}\n🛒 ยอดขายรวม: ${currentSalesData.totalSales} บาท\n📦 จำนวนออเดอร์: ${currentSalesData.totalOrders} รายการ`;
        document.getElementById('reportSummary').value = summaryText;
    };

    // ฟังก์ชันสำหรับกดส่งรีพอร์ตไปที่ Supabase
    async function sendReportToLine() {
        const btn = document.querySelector('button[onclick="sendReportToLine()"]');
        btn.disabled = true;
        btn.innerText = "กำลังส่งข้อมูล...";

        try {
            // ยิงข้อมูลไปที่ Supabase Edge Function ของคุณ (ใช้ Project ID จริง)
            const response = await fetch("https://wmhweeeyulhmoilypklz.supabase.co/functions/v1/send-line-report", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(currentSalesData)
            });

            // ตรวจสอบข้อมูลที่รับกลับมา
            const textResponse = await response.text();
            let result;
            try {
                result = JSON.parse(textResponse);
            } catch (e) {
                result = { message: textResponse };
            }

            if (response.ok) {
                alert("✅ ส่งรีพอร์ตเข้า LINE สำเร็จแล้ว! ลองเช็กในแชท LINE ร้านได้เลยครับ");
            } else {
                alert("❌ ส่งไม่สำเร็จ (Server Error): " + (result.error || result.message || "ไม่ทราบสาเหตุ"));
            }
        } catch (error) {
            console.error("Error:", error);
            alert("❌ เกิดข้อผิดพลาดในการเชื่อมต่อ: " + error.message + "\n(คำแนะนำ: หากทดสอบในมือถือผ่าน localhost แนะนำให้ลองทดสอบผ่านคอมพิวเตอร์แทนครับ)");
        } finally {
            btn.disabled = false;
            btn.innerText = "🚀 ส่งรายงานยอดขายเข้า LINE ทันที";
        }
    }
</script>

</body>
</html>
