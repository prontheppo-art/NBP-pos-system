<!--
  ========================================
  [File Note]
  - File Name: printorder.html
  - External Scripts: 
      1. https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2
      2. https://cdn.tailwindcss.com
      3. supabaseClient.js (Supabase Initialization)
  - Target Destination: index.html
  ========================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>รายการอาหาร - ลาบหนองบัวลำภู</title>
    
    <!-- Supabase JS Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ดึงการเชื่อมต่อ Supabase จากไฟล์ supabaseClient.js (ข้อ 1) -->
    <script src="supabaseClient.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');
        
        /* ข้อ 2: เปิดให้ scroll ได้ (pan-y) และป้องกันการซูม */
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif; 
            background-color: #f1f5f9;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
        }

        .app-viewport {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 420px;
            margin: 0 auto;
            padding: 12px;
            box-sizing: border-box;
        }

        .print-card {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            position: relative;
        }

        /* ข้อ 4: ล็อคส่วนหัว (Sticky Top View) */
        .header-section {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            z-index: 20;
            flex-shrink: 0;
        }

        .content-scrollable {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .items-box-container {
            border: 2px solid #0f172a;
            border-radius: 16px;
            padding: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            margin-bottom: 8px;
        }

        .scrollable-items {
            flex: 1;
            overflow-y: auto;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
        }

        /* ข้อ 4: ล็อคส่วนท้าย (Sticky Bottom View) */
        .footer-section {
            position: sticky;
            bottom: 0;
            background-color: #ffffff;
            z-index: 20;
            flex-shrink: 0;
        }

        @media print {
            html, body {
                height: auto !important;
                overflow: visible !important;
                background-color: #ffffff !important;
            }

            .app-viewport {
                max-width: 100% !important;
                height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .print-card {
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                padding: 0 !important;
                height: auto !important;
                display: block !important;
            }

            .items-box-container {
                border: 2px solid #0f172a !important;
                border-radius: 16px !important;
                overflow: visible !important;
                height: auto !important;
                flex: none !important;
            }

            .scrollable-items {
                overflow: visible !important;
                height: auto !important;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <div class="print-card">
            
            <!-- 🟢 ส่วนที่ 1: หัวกระดาษ (Sticky Top View - ข้อ 4) -->
            <div class="header-section text-center mb-3 pb-1">
                <h2 class="font-extrabold text-slate-800 text-lg leading-tight">ลาบหนองบัวลำภู @เขื่อนขุนด่าน</h2>
                <p class="text-xs text-slate-500 font-semibold mt-0.5">064-565-4951</p>
                <p class="text-xs text-slate-700 font-bold mt-1">
                    รายการอาหาร<span id="customerGroupWrapper"> ( <span id="customerGroupLabel">-</span> )</span>
                </p>
            </div>

            <!-- 🟡 ส่วนที่ 2: เนื้อหาตรงกลาง (Scrollable Area) -->
            <div class="content-scrollable">
                <!-- กรอบรายการอาหาร (Cart Box) -->
                <div class="items-box-container">
                    <div class="scrollable-items">
                        <div id="itemListContainer" class="w-full space-y-1.5">
                            <p class="text-slate-300 font-bold text-center text-sm my-auto py-6">ไม่มีรายการอาหาร</p>
                        </div>
                    </div>
                </div>

                <!-- หมายเหตุออเดอร์ (ถ้ามี) -->
                <div id="orderNoteContainer" class="hidden shrink-0 mb-2 p-2 bg-amber-50 border border-amber-200 rounded-xl text-xs font-semibold text-amber-900">
                    <span>📝 หมายเหตุ: </span><span id="orderNoteText"></span>
                </div>

                <!-- สรุปจำนวนและราคารวม -->
                <div class="flex items-center justify-between border-b-2 border-dashed border-slate-200 pb-2.5 mb-2 shrink-0">
                    <div class="border border-slate-800 rounded-lg px-2.5 py-1">
                        <span id="summaryQty" class="font-extrabold text-xs text-slate-800">0 รายการ | 0 ชิ้น</span>
                    </div>
                    <div class="text-right">
                        <span class="font-extrabold text-base text-slate-900">รวม <span id="summaryTotal">0</span> บาท</span>
                    </div>
                </div>

                <!-- ส่วน QR Code (แสดงเฉพาะกลุ่มนักท่องเที่ยว) -->
                <div id="touristOnlySection" class="hidden text-center shrink-0 my-1">
                    <p class="text-xs font-bold text-slate-700 mb-0.5">⭐ ขอบพระคุณที่อุดหนุนค่ะ ⭐</p>
                    <p class="text-[10px] text-slate-500 font-semibold mb-1">แนะนำ ติชม ได้นะคะ 🙏</p>
                    <div class="flex justify-center mb-1">
                        <div class="p-1 border border-slate-300 rounded-xl bg-white shadow-sm">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=ลาบหนองบัวลำภู" alt="QR Code" class="w-20 h-20 object-contain">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 🟢 ส่วนที่ 3: ปุ่มกดด้านล่าง (Sticky Bottom View - ข้อ 4) -->
            <div class="footer-section no-print pt-2 border-t border-slate-100">
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="saveOnlyBtn" onclick="handleSaveOrder(false)" class="w-full py-2.5 bg-slate-700 hover:bg-slate-800 active:scale-95 text-white font-extrabold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5 cursor-pointer">
                        <span>💾</span>
                        <span id="saveBtnText">บันทึก</span>
                    </button>

                    <button type="button" id="saveAndPrintBtn" onclick="handleSaveOrder(true)" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-extrabold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5 cursor-pointer">
                        <span>🖨️</span>
                        <span id="printBtnText">บันทึก / พิมพ์</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentOrderData = null;
        let processedItemsForDb = [];

        function getSupabaseClient() {
            if (typeof window.supabaseClient?.from === 'function') return window.supabaseClient;
            if (typeof supabase?.from === 'function') return supabase;
            if (typeof supabase?.createClient === 'function' && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
                window.supabaseClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
                return window.supabaseClient;
            }
            return null;
        }

        // ข้อ 2: ป้องกัน Gesture Pinch-to-zoom และ Double-tap zoom บนอุปกรณ์พกพา
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        window.addEventListener('DOMContentLoaded', () => {
            loadOrderData();
        });

        function loadOrderData() {
            const pendingOrderRaw = localStorage.getItem('pendingOrder');
            if (!pendingOrderRaw) return;

            currentOrderData = JSON.parse(pendingOrderRaw);
            const cart = currentOrderData.cart || [];
            
            // เปรียบเทียบค่าโดยตรง ไม่แปลงประเภทข้อมูลซ้ำซ้อน
            const groupId = currentOrderData.groupId ?? currentOrderData.customerGroupId ?? currentOrderData.customer_type_id ?? 1;

            // 1. จัดการแสดงผล QR Code (แสดงเฉพาะกลุ่มนักท่องเที่ยว groupId === 2)
            const touristSection = document.getElementById('touristOnlySection');
            if (touristSection) {
                if (groupId === 2) {
                    touristSection.classList.remove('hidden');
                } else {
                    touristSection.classList.add('hidden');
                }
            }

            // 2. จัดการแสดงผลกลุ่มลูกค้า / สถานที่
            const groupWrapper = document.getElementById('customerGroupWrapper');
            const groupLabel = document.getElementById('customerGroupLabel');

            if (groupId === 2) {
                let locDetails = [];
                if (currentOrderData.locationName) locDetails.push(currentOrderData.locationName);
                if (currentOrderData.zoneName && currentOrderData.zoneName !== currentOrderData.locationName) {
                    locDetails.push(currentOrderData.zoneName);
                }

                let groupDisplay = locDetails.join(' - ') || 'นักท่องเที่ยว';
                const rawPhone = String(currentOrderData.customerPhone || currentOrderData.phone || '').trim();

                // ตรวจสอบเบอร์โทรศัพท์: ตัวเลขล้วน 10 หลัก
                const isValidPhone = /^\d{10}$/.test(rawPhone);
                if (isValidPhone) {
                    groupDisplay += ` โทร: ${rawPhone}`;
                }

                if (groupLabel) groupLabel.textContent = groupDisplay;
                if (groupWrapper) groupWrapper.classList.remove('hidden');
            } else {
                if (groupWrapper) groupWrapper.classList.add('hidden');
            }

            // 3. แสดงหมายเหตุออเดอร์
            const noteVal = currentOrderData.orderNote || currentOrderData.note;
            if (noteVal) {
                const noteContainer = document.getElementById('orderNoteContainer');
                const noteText = document.getElementById('orderNoteText');
                if (noteContainer && noteText) {
                    noteText.textContent = noteVal;
                    noteContainer.classList.remove('hidden');
                }
            }

            // 4. แสดงรายการอาหาร
            renderItemList(cart, groupId, currentOrderData.deliveryFee || currentOrderData.delivery_fee || 0, currentOrderData.grandTotal || currentOrderData.total_price || 0);
        }

        function renderItemList(cart, groupId, deliveryFee, grandTotal) {
            const container = document.getElementById('itemListContainer');
            const summaryQtyEl = document.getElementById('summaryQty');
            const summaryTotalEl = document.getElementById('summaryTotal');

            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-slate-300 font-bold text-center text-sm my-auto py-6">ไม่มีรายการอาหาร</p>`;
                if (summaryQtyEl) summaryQtyEl.textContent = `0 รายการ | 0 ชิ้น`;
                if (summaryTotalEl) summaryTotalEl.textContent = `0`;
                return;
            }

            let totalItems = cart.length;
            let totalQty = 0;
            let html = '';
            processedItemsForDb = [];

            cart.forEach(item => {
                const qty = item.qty || 1;
                let basePrice = 0;

                // ตรวจสอบ Custom Price หรือเปรียบเทียบตาม groupId โดยตรง
                if ((item.is_custom_price || item.isCustomPrice) && (item.custom_price || item.price) > 0) {
                    basePrice = item.custom_price || item.price;
                } else {
                    if (groupId === 1) {
                        basePrice = item.price_1 ?? item.price1 ?? item.price ?? 0;
                    } else if (groupId === 2) {
                        basePrice = item.price_2 ?? item.price2 ?? item.price ?? 0;
                    } else if (groupId === 3) {
                        basePrice = item.price_3 ?? item.price3 ?? item.price ?? 0;
                    } else {
                        basePrice = item.price ?? 0;
                    }
                    
                    if (basePrice === 0) {
                        basePrice = item.price ?? item.unit_price ?? item.base_price ?? 0;
                    }
                }

                const daoQty = item.friedEggQty || item.khaiDaoQty || item.fried_egg || item.egg_dao || item.eggDao || 0;
                const jiaoQty = item.omeletQty || item.khaiJiaoQty || item.omelet || item.egg_jiao || item.eggJiao || 0;

                const eggCost = daoQty * 10;
                const omeletCost = jiaoQty * 10;
                const unitPrice = basePrice + eggCost + omeletCost;
                const itemTotal = unitPrice * qty;

                totalQty += qty;

                let itemSubDetails = [];
                if (daoQty > 0) itemSubDetails.push(`ไข่ดาว ${daoQty > 1 ? daoQty + ' ฟอง' : ''}`.trim());
                if (jiaoQty > 0) itemSubDetails.push(`ไข่เจียว ${jiaoQty > 1 ? jiaoQty + ' ฟอง' : ''}`.trim());
                if (item.note) itemSubDetails.push(item.note);

                processedItemsForDb.push({
                    ...item,
                    price: basePrice,
                    unit_price: unitPrice,
                    total_price: itemTotal
                });

                html += `
                <div class="flex justify-between items-start text-xs font-bold text-slate-800 py-0.5">
                    <div class="flex-1 pr-2 flex items-start gap-1">
                        <span class="shrink-0 text-slate-600">x${qty}</span>
                        <div>
                            <span class="block truncate max-w-[150px]">${item.name || item.food_name}</span>
                            ${itemSubDetails.length > 0 ? `<span class="block text-[10px] text-slate-500 font-normal">(${itemSubDetails.join(', ')})</span>` : ''}
                        </div>
                    </div>
                    <span class="shrink-0 text-center min-w-[50px] text-slate-500 font-semibold">${unitPrice}.-</span>
                    <span class="shrink-0 text-right min-w-[50px] font-extrabold text-slate-900">${itemTotal}.-</span>
                </div>
                `;
            });

            if (deliveryFee > 0) {
                html += `
                <div class="flex justify-between items-center text-xs font-bold text-slate-700 pt-1 border-t border-slate-200 mt-1">
                    <span>🛵 ค่าบริการจัดส่ง</span>
                    <span>${deliveryFee}.-</span>
                </div>
                `;
            }

            container.innerHTML = html;
            if (summaryQtyEl) summaryQtyEl.textContent = `${totalItems} รายการ | ${totalQty} ชิ้น`;
            if (summaryTotalEl) summaryTotalEl.textContent = Number(grandTotal).toLocaleString();
        }

        async function handleSaveOrder(shouldPrint = false) {
            if (!currentOrderData) {
                window.location.href = 'index.html';
                return;
            }

            const btnSave = document.getElementById('saveOnlyBtn');
            const btnSavePrint = document.getElementById('saveAndPrintBtn');
            const saveText = document.getElementById('saveBtnText');
            const printText = document.getElementById('printBtnText');

            try {
                btnSave.disabled = true;
                btnSavePrint.disabled = true;
                if (shouldPrint && printText) printText.textContent = 'กำลังบันทึก...';
                if (!shouldPrint && saveText) saveText.textContent = 'กำลังบันทึก...';

                const _db = getSupabaseClient();

                if (_db) {
                    const custName = currentOrderData.customerName || '';
                    const custPhone = currentOrderData.customerPhone || currentOrderData.phone || '';
                    let finalCustomerId = currentOrderData.selectedCustomerId || currentOrderData.customer_id || null;

                    const combinedNamePhone = [custName, custPhone].filter(Boolean).join(' ') || 'ลูกค้าทั่วไป';

                    // 1. จัดการลูกค้าในตาราง public.customers (ที่มีเฉพาะ customer_id และ name ตาม Schema)
                    if (!finalCustomerId && (custName || custPhone)) {
                        let existingCust = null;

                        if (custPhone) {
                            const { data } = await _db.from('customers').select('customer_id').ilike('name', `%${custPhone}%`).limit(1);
                            if (data && data.length > 0) existingCust = data[0];
                        }

                        if (existingCust) {
                            finalCustomerId = existingCust.customer_id;
                        } else {
                            const { data: newCust, error: custErr } = await _db
                                .from('customers')
                                .insert([{ name: combinedNamePhone }])
                                .select('customer_id');

                            if (custErr) console.error('Customer Insert Error:', custErr);
                            if (!custErr && newCust && newCust.length > 0) {
                                finalCustomerId = newCust[0].customer_id;
                            }
                        }
                    }

                    const totalQty = (currentOrderData.cart || []).reduce((sum, item) => sum + (item.qty || 1), 0);

                    // 2. จัดการโครงสร้างข้อมูล Payload ตาม public.orders ใน schema.sql
                    const insertPayload = {
                        customer_id: finalCustomerId,
                        customer_type_id: currentOrderData.groupId ?? currentOrderData.customerGroupId ?? currentOrderData.customer_type_id ?? 1,
                        name_phone: combinedNamePhone,
                        location_id: currentOrderData.locationId || currentOrderData.location_id || null,
                        zone_id: currentOrderData.zoneId || currentOrderData.zone_id || null,
                        subtotal: currentOrderData.subtotal || 0,
                        delivery_fee: currentOrderData.deliveryFee || currentOrderData.delivery_fee || 0,
                        total_price: currentOrderData.grandTotal || currentOrderData.total_price || 0,
                        total_qty: totalQty,
                        items: processedItemsForDb.length > 0 ? processedItemsForDb : (currentOrderData.cart || []),
                        note: currentOrderData.orderNote || currentOrderData.note || ''
                    };

                    const { data: orderResult, error: orderErr } = await _db
                        .from('orders')
                        .insert([insertPayload])
                        .select();

                    if (orderErr) {
                        console.error('Supabase Insert Order Error:', orderErr);
                        alert('เกิดข้อผิดพลาดในการบันทึกออเดอร์: ' + orderErr.message);
                        return;
                    } else {
                        console.log('บันทึกออเดอร์สำเร็จ:', orderResult);
                    }
                }

                if (shouldPrint) {
                    window.print();
                }

                localStorage.removeItem('pendingOrder');
                localStorage.removeItem('cart');
                window.location.href = 'index.html';

            } catch (err) {
                console.error('Save Order Exception:', err);
                alert('เกิดข้อผิดพลาดในการทำงาน: ' + err.message);
            } finally {
                btnSave.disabled = false;
                btnSavePrint.disabled = false;
                if (saveText) saveText.textContent = 'บันทึก';
                if (printText) printText.textContent = 'บันทึก / พิมพ์';
            }
        }
    </script>
</body>
</html>
