<!--
  ========================================================================
  [File Note]
  - File Name: foodgroups.html
  - Description: หน้าจัดการ เพิ่ม/แก้ไข/ลบ กลุ่มรายการอาหาร (สำหรับ Admin)
  - External Libraries (CDNs):
    1. Supabase JS SDK v2 (https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)
    2. Tailwind CSS (https://cdn.tailwindcss.com)
  - Linked Local Files:
    1. supabaseClient.js (ไฟล์สำหรับเชื่อมต่อ Supabase Database Initialization)
  - Navigation Destination Pages:
    1. index.html (หน้าหลักของระบบ)
  - Supabase Database Tables Used:
    1. public.food_groups (อ่าน, เพิ่ม, แก้ไข, ลบข้อมูลกลุ่มรายการอาหาร)
  ========================================================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เพิ่มกลุ่มรายการอาหาร - ลาบหนองบัวลำภู</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ดึงการเชื่อมต่อ Supabase จากไฟล์ supabaseClient.js -->
    <script src="supabaseClient.js"></script>

    <style>
      html, body {
        min-height: 100%;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f4f6f9;
        touch-action: pan-y;
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
      }

      .app-layout {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        background: #fff;
        box-sizing: border-box;
        padding: 16px 16px 12px 16px;
        position: relative;
      }

      .header-section {
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 20;
        flex-shrink: 0;
      }

      .content-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        -webkit-overflow-scrolling: touch;
        min-height: 0;
      }

      .footer-section {
        position: sticky;
        bottom: 0;
        background: #fff;
        z-index: 20;
        flex-shrink: 0;
      }
    </style>
</head>
<body class="bg-gray-100 flex items-start justify-center">

    <div class="w-full bg-white rounded-3xl shadow-2xl app-layout">
        
        <!-- ส่วนหัว (Header - Sticky Top) -->
        <div class="header-section pb-2 pt-1">
            <h2 class="text-xl font-black text-slate-800 text-center mb-3 tracking-tight">📁 จัดการกลุ่มรายการอาหาร</h2>
            
            <div class="bg-gray-50 p-2 rounded-2xl border border-gray-200 space-y-2">
                <div class="flex gap-2">
                    <input type="text" id="addCategoryInput" placeholder="กรอกชื่อกลุ่มรายการ..." onkeydown="if(event.key==='Enter') handleSaveCategoryAction()" class="flex-1 border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none bg-white focus:border-indigo-500 transition font-medium">
                    <button type="button" onclick="handleSaveCategoryAction()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shrink-0 cursor-pointer shadow-2xs active:scale-95">
                        เพิ่ม
                    </button>
                </div>
                <!-- ช่อง Quick Search สำหรับค้นหากลุ่มอาหาร -->
                <div>
                    <input type="text" id="searchCategoryInput" oninput="handleSearchCategory()" placeholder="🔍 ค้นหากลุ่มรายการ..." class="w-full border border-gray-200 rounded-xl px-3 py-1.5 text-xs outline-none bg-white focus:border-indigo-400 transition font-normal text-gray-600">
                </div>
            </div>
            
            <hr class="border-gray-100 my-2">
            <div class="text-xs font-bold text-gray-700 flex items-center justify-between">
                <span class="flex items-center gap-1">📂 กลุ่มรายการอาหารทั้งหมด:</span>
                <span class="text-[10px] text-gray-400 font-normal">*แตะที่ชื่อเพื่อแก้ไข</span>
            </div>
        </div>
        
        <!-- รายการหมวดหมู่ (Content - Scrollable Area) -->
        <div class="content-section py-2 overflow-y-auto">
            <div id="categoryListContainer" class="space-y-1.5 pr-1">
                <div class="text-center text-gray-400 text-xs py-8">⏳ กำลังโหลดกลุ่มรายการ...</div>
            </div>
        </div>

        <!-- ปุ่มล่างสุด กลับหน้า index.html (Footer - Sticky Bottom) -->
        <div class="footer-section pt-2 pb-1 border-t border-gray-100">
            <a href="index.html" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-2xl text-xs text-center transition flex items-center justify-center gap-1 shadow-md no-underline">
                🔑 กลับหน้าหลัก
            </a>
        </div>
    </div>

    <!-- Modal ป๊อปอัปแจ้งเตือน -->
    <div id="customAlertModal" onclick="handleOutsideClick(event, 'customAlertModal')" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-5 text-center space-y-3">
            <div id="alertIconContainer" class="w-12 h-12 rounded-full flex items-center justify-center mx-auto text-2xl">
                ⚠️
            </div>
            <div>
                <h3 id="alertTitle" class="font-bold text-sm text-gray-800">แจ้งเตือน</h3>
                <p id="alertMessageText" class="text-xs text-gray-600 mt-1 font-medium leading-relaxed"></p>
            </div>
            <div class="pt-1">
                <button onclick="closeModal('customAlertModal')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-2xs cursor-pointer">
                    ตกลง
                </button>
            </div>
        </div>
    </div>

    <!-- Modal ป๊อปอัปแก้ไขชื่อกลุ่มรายการอาหาร -->
    <div id="editCategoryModal" onclick="handleOutsideClick(event, 'editCategoryModal')" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-5 text-left space-y-4">
            <div class="flex items-center justify-between border-b border-gray-100 pb-2">
                <h3 class="font-bold text-sm text-gray-800 flex items-center gap-1.5">
                    <span>✏️</span> แก้ไขชื่อกลุ่มรายการ
                </h3>
                <button onclick="closeModal('editCategoryModal')" class="text-gray-400 hover:text-gray-600 text-sm font-bold cursor-pointer">✕</button>
            </div>
            
            <div>
                <label class="block text-[11px] font-bold text-gray-600 mb-1.5">ชื่อกลุ่มรายการใหม่:</label>
                <input type="text" id="editCategoryNameInput" onkeydown="if(event.key==='Enter') handleUpdateCategory()" placeholder="เช่น ส้มตำ / ลาบ" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs outline-none bg-gray-50 focus:bg-white focus:border-indigo-500 font-bold text-gray-800 transition">
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeModal('editCategoryModal')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2.5 rounded-xl text-xs transition cursor-pointer">
                    ยกเลิก
                </button>
                <button onclick="handleUpdateCategory()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-2xs cursor-pointer">
                    บันทึก
                </button>
            </div>
        </div>
    </div>

    <!-- Modal ป๊อปอัปยืนยันการลบกลุ่มรายการอาหาร -->
    <div id="deleteCategoryModal" onclick="handleOutsideClick(event, 'deleteCategoryModal')" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-5 text-center space-y-3">
            <div class="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                ⚠️
            </div>
            <div>
                <h3 class="font-black text-base text-gray-800">ยืนยันการลบ?</h3>
                <p class="text-xs text-gray-500 mt-1">คุณต้องการลบกลุ่มรายการ <span id="deleteTargetCategoryName" class="font-bold text-red-600">""</span> ใช่หรือไม่?</p>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="closeModal('deleteCategoryModal')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2.5 rounded-xl text-xs transition cursor-pointer">
                    ยกเลิก
                </button>
                <button onclick="confirmExecuteDeleteCategory()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-2xs cursor-pointer">
                    ลบกลุ่มรายการ
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
      // สคริปต์ป้องกัน Gesture Zoom (Pinch-to-zoom & Double-tap zoom)
      document.addEventListener('touchstart', function(event) {
          if (event.touches.length > 1) {
              event.preventDefault();
          }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
          const now = (new Date()).getTime();
          if (now - lastTouchEnd <= 300) {
              event.preventDefault();
          }
          lastTouchEnd = now;
      }, false);

      let categories = [];
      let filteredCategories = [];
      let activeEditingCategoryId = null;
      let activeDeletingCategoryId = null;
      let dbClient = null;

      function getDbClient() {
          if (dbClient) return dbClient;
          if (typeof supabaseClient !== 'undefined') {
              dbClient = supabaseClient;
          } else if (typeof window.supabaseClient !== 'undefined') {
              dbClient = window.supabaseClient;
          } else if (typeof window.supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_KEY !== 'undefined') {
              dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          }
          return dbClient;
      }

      window.addEventListener('DOMContentLoaded', async () => {
          const client = getDbClient();
          if (!client) {
              showAlertModal('ไม่พบการเชื่อมต่อ Supabase ในไฟล์ supabaseClient.js', 'error');
              return;
          }

          await fetchCategories();
      });

      function openModal(id) {
          document.getElementById(id)?.classList.remove('hidden');
      }

      function closeModal(id) {
          document.getElementById(id)?.classList.add('hidden');
          if (id === 'editCategoryModal') activeEditingCategoryId = null;
          if (id === 'deleteCategoryModal') activeDeletingCategoryId = null;
      }

      function handleOutsideClick(event, modalId) {
          if (event.target.id === modalId) {
              closeModal(modalId);
          }
      }

      function showAlertModal(message, type = 'warning') {
          const iconContainer = document.getElementById('alertIconContainer');
          const titleEl = document.getElementById('alertTitle');
          const textEl = document.getElementById('alertMessageText');

          textEl.textContent = message;

          if (type === 'error') {
              iconContainer.className = 'w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto text-2xl';
              iconContainer.textContent = '❌';
              titleEl.textContent = 'เกิดข้อผิดพลาด';
          } else if (type === 'success') {
              iconContainer.className = 'w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl';
              iconContainer.textContent = '✅';
              titleEl.textContent = 'สำเร็จ';
          } else {
              iconContainer.className = 'w-12 h-12 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto text-2xl';
              iconContainer.textContent = '⚠️';
              titleEl.textContent = 'แจ้งเตือน';
          }

          openModal('customAlertModal');
      }

      async function fetchCategories() {
          const container = document.getElementById('categoryListContainer');
          const client = getDbClient();
          if (!client) return;

          try {
              const { data, error } = await client
                  .from('food_groups')
                  .select('id, name')
                  .order('id', { ascending: true });

              if (error) throw error;

              categories = data || [];
              filteredCategories = [...categories];
              
              const searchInput = document.getElementById('searchCategoryInput');
              if (searchInput && searchInput.value.trim()) {
                  handleSearchCategory();
              } else {
                  renderCategoryList(filteredCategories);
              }
          } catch (err) {
              console.error('Error fetching categories:', err);
              if (container) {
                  container.innerHTML = `<div class="text-center text-red-400 text-xs py-4">ไม่สามารถโหลดข้อมูลได้: ${err.message}</div>`;
              }
          }
      }

      function handleSearchCategory() {
          const query = document.getElementById('searchCategoryInput').value.trim().toLowerCase();
          if (!query) {
              filteredCategories = [...categories];
          } else {
              filteredCategories = categories.filter(c => (c.name || '').toLowerCase().includes(query));
          }
          renderCategoryList(filteredCategories);
      }

      function escapeHtml(text) {
          if (!text) return '';
          return String(text)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
      }

      function renderCategoryList(listData) {
          const container = document.getElementById('categoryListContainer');
          if (!container) return;

          const list = listData || [];

          if (list.length === 0) {
              container.innerHTML = `<div class="text-center text-gray-400 text-xs py-8">ไม่พบกลุ่มรายการอาหาร</div>`;
              return;
          }

          container.innerHTML = list.map(c => {
              const safeName = escapeHtml(c.name);
              return `
                <div class="flex items-center justify-between bg-white border border-gray-200 hover:border-indigo-300 rounded-2xl px-3.5 py-2 transition shadow-2xs">
                    <span onclick="openEditCategoryModal(${c.id}, '${safeName}')" class="font-bold text-base text-gray-800 truncate cursor-pointer flex-1 py-0.5 hover:text-indigo-600 transition">
                        📁 ${safeName}
                    </span>
                    <button onclick="openDeleteCategoryModal(${c.id}, '${safeName}')" class="w-6 h-6 bg-red-50 hover:bg-red-100 text-red-500 rounded-full flex items-center justify-center text-xs font-bold transition shrink-0 ml-2 cursor-pointer" title="ลบหมวดหมู่">
                        ✕
                    </button>
                </div>
              `;
          }).join('');
      }

      function openEditCategoryModal(id, currentName) {
          activeEditingCategoryId = id;
          // แปลง HTML Entities กลับเป็นข้อความปกติใส่ Input
          const txt = document.createElement('textarea');
          txt.innerHTML = currentName;
          document.getElementById('editCategoryNameInput').value = txt.value;
          openModal('editCategoryModal');
      }

      async function handleUpdateCategory() {
          if (!activeEditingCategoryId) return;
          const client = getDbClient();
          if (!client) return;

          const newName = document.getElementById('editCategoryNameInput').value.trim();

          if (!newName) {
              showAlertModal('กรุณากรอกชื่อกลุ่มรายการอาหาร', 'warning');
              return;
          }

          try {
              const { error } = await client
                  .from('food_groups')
                  .update({ name: newName })
                  .eq('id', activeEditingCategoryId);

              if (error) throw error;

              closeModal('editCategoryModal');
              await fetchCategories();
          } catch (err) {
              showAlertModal('ไม่สามารถอัปเดตได้: ' + err.message, 'error');
          }
      }

      async function handleSaveCategoryAction() {
          const client = getDbClient();
          if (!client) {
              showAlertModal('ไม่พบระบบเชื่อมต่อฐานข้อมูล', 'error');
              return;
          }

          const input = document.getElementById('addCategoryInput');
          const name = input.value.trim();

          if (!name) {
              showAlertModal('กรุณากรอกชื่อกลุ่มรายการอาหาร', 'warning');
              return;
          }

          try {
              const { error } = await client
                  .from('food_groups')
                  .insert([{ name: name }]);

              if (error) throw error;

              input.value = '';
              await fetchCategories();
          } catch (err) {
              showAlertModal('ไม่สามารถเพิ่มกลุ่มรายการได้: ' + err.message, 'error');
          }
      }

      function openDeleteCategoryModal(id, name) {
          activeDeletingCategoryId = id;
          const txt = document.createElement('textarea');
          txt.innerHTML = name;
          document.getElementById('deleteTargetCategoryName').textContent = `"${txt.value}"`;
          openModal('deleteCategoryModal');
      }

      async function confirmExecuteDeleteCategory() {
          if (!activeDeletingCategoryId) return;
          const client = getDbClient();
          if (!client) return;

          try {
              const { error } = await client
                  .from('food_groups')
                  .delete()
                  .eq('id', activeDeletingCategoryId);

              if (error) throw error;

              closeModal('deleteCategoryModal');
              await fetchCategories();
          } catch (err) {
              showAlertModal('ไม่สามารถลบได้: ' + err.message, 'error');
          }
      }
    </script>
</body>
</html>
