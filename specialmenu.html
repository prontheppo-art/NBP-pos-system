<!--
  ========================================
  [File Note]
  - File Name: specialmenu.html
  - Description: หน้าจัดการเมนูพิเศษ (บันทึกและดึงข้อมูลจากตาราง foods ใน Supabase พร้อมส่งสัญญาณเปิด Pop-up selectitem.html)
  ========================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>สั่งรายการอาหารพิเศษ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    
    <style>
        :root { --bg-color: #ffffff; }
        
        html, body { 
            width: 100%; height: 100vh; height: 100dvh;
            touch-action: pan-y; -webkit-text-size-adjust: 100%;
            background-color: var(--bg-color); color: #1e293b;
            font-family: 'Sarabun', sans-serif; font-size: 15px !important;
            margin: 0; padding: 0; user-select: none; display: flex; flex-direction: column; overflow: hidden;
        }

        input[type="number"], input[type="text"] { font-size: 15px !important; }
        .custom-label { font-size: 15px !important; font-weight: 700; }

        .special-preset-btn {
            background-color: #ffffff; border: 1px solid #cbd5e1; color: #334155;
            font-weight: 700; padding: 10px 12px; border-radius: 10px; cursor: pointer;
            transition: all 0.15s ease; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: center; min-height: 46px;
        }
        .special-preset-btn:hover { background-color: #f8fafc; border-color: #94a3b8; }
        .special-preset-btn:active { background-color: #e2e8f0; transform: scale(0.97); }

        .sticky-footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: #ffffff; border-top: 1px solid #e2e8f0;
            padding: 0.75rem; box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05); z-index: 40;
        }

        @keyframes modalBounce {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in { animation: modalBounce 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        ::-webkit-scrollbar { width: 4px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-white text-slate-800 antialiased">

    <!-- 1. เนื้อหาด้านบน: ปุ่มเมนูพิเศษยอดฮิต -->
    <div class="flex-1 overflow-y-auto p-3 max-w-md w-full mx-auto space-y-3 pb-64">
        <div class="border border-amber-300 rounded-xl p-3 space-y-2 bg-amber-50/30 shadow-xs">
            <div class="text-[14px] font-bold text-amber-800 mb-1">🔥 เลือกจากเมนูพิเศษ (ดึงจากตาราง foods):</div>
            <div id="presetButtonsContainer" class="grid grid-cols-3 gap-2">
                <div class="text-xs text-slate-400 col-span-3 text-center py-3">กำลังโหลดรายการจากฐานข้อมูล...</div>
            </div>
        </div>
    </div>

    <!-- 2. ฟอร์มเพิ่มเมนูใหม่ และปุ่มด้านล่าง -->
    <div class="sticky-footer">
        <div class="max-w-md mx-auto space-y-2">
            <div class="border border-emerald-200 rounded-xl p-2.5 space-y-2 bg-emerald-50/20 shadow-xs">
                <div class="text-[13px] font-bold text-emerald-800 flex items-center gap-1">
                    <span>➕ เพิ่มเมนูพิเศษใหม่ (บันทึกลง Supabase)</span>
                </div>

                <div class="flex items-center gap-2">
                    <span class="custom-label text-slate-700 text-xs whitespace-nowrap w-20 flex-shrink-0">ชื่อเมนูใหม่</span>
                    <input type="text" id="customFoodName" placeholder="เช่น ราดหน้าเส้นใหญ่..." autocomplete="off"
                           class="flex-1 px-2 py-1 border border-slate-300 focus:border-emerald-500 rounded-lg text-xs font-bold text-slate-800 focus:outline-none bg-white placeholder:text-slate-400 placeholder:font-normal">
                </div>

                <div class="space-y-0.5">
                    <div class="grid grid-cols-3 gap-1.5 text-center">
                        <span class="text-[11px] font-bold text-slate-700">ชาวบ้าน</span>
                        <span class="text-[11px] font-bold text-slate-700">นักท่องเที่ยว</span>
                        <span class="text-[11px] font-bold text-slate-700">สบายดี</span>
                    </div>
                    <div class="grid grid-cols-3 gap-1.5">
                        <input type="number" id="price1Input" min="0" step="any" placeholder="ราคา" 
                               class="w-full px-1.5 py-1 border border-emerald-300 focus:border-emerald-500 rounded-lg text-center text-xs font-bold text-slate-800 focus:outline-none bg-white">
                        <input type="number" id="price2Input" min="0" step="any" placeholder="ราคา" 
                               class="w-full px-1.5 py-1 border border-emerald-300 focus:border-emerald-500 rounded-lg text-center text-xs font-bold text-slate-800 focus:outline-none bg-white">
                        <input type="number" id="price3Input" min="0" step="any" placeholder="ราคา" 
                               class="w-full px-1.5 py-1 border border-emerald-300 focus:border-emerald-500 rounded-lg text-center text-xs font-bold text-slate-800 focus:outline-none bg-white">
                    </div>
                </div>
            </div>

            <!-- แถบปุ่มคู่ด้านล่าง -->
            <div class="flex gap-2">
                <button type="button" onclick="saveNewSpecialMenu()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-3 rounded-xl text-[13px] shadow-md active:scale-95 transition cursor-pointer flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <span>💾 บันทึก (ตกลง)</span>
                </button>
                <button type="button" onclick="goToOrderEntity()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 font-bold py-2.5 px-3 rounded-xl text-[13px] shadow-sm active:scale-95 transition cursor-pointer flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <span>🏠 กลับเมนูหลัก</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal แจ้งเตือน -->
    <div id="customAlertOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-3xl p-5 max-w-xs w-full text-center shadow-2xl border-2 border-slate-100 animate-bounce-in">
            <div id="alertIconBg" class="w-14 h-14 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">⚠️</div>
            <h3 id="alertTitle" class="text-[15px] font-extrabold text-slate-800 mb-1">แจ้งเตือน</h3>
            <p id="alertMessage" class="text-[15px] font-bold text-slate-600 mb-5 leading-relaxed">กรุณากรอกข้อมูลให้ครบถ้วน</p>
            <button type="button" onclick="closeCustomAlert()" class="w-full bg-slate-800 hover:bg-slate-900 active:scale-95 text-white font-bold py-2.5 rounded-xl text-[15px] transition shadow cursor-pointer">
                ตกลง
            </button>
        </div>
    </div>

    <script>
        let db;
        let specialMenuData = []; 

        function getDbClient() {
            if (db) return db;
            if (typeof window.supabaseClient !== 'undefined') {
                db = window.supabaseClient;
            } else if (typeof supabaseClient !== 'undefined') {
                db = supabaseClient;
            } else if (typeof supabase !== 'undefined' && supabase.createClient) {
                db = supabase;
            }
            return db;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            db = getDbClient();
            await fetchSpecialFoodsFromDB();
        });

        async function fetchSpecialFoodsFromDB() {
            try {
                if (!db) db = getDbClient();
                if (db) {
                    // ดึงเฉพาะรายการในตาราง foods ที่มี food_group_id เป็น 98 (หรือเงื่อนไขหมวดหมู่เมนูพิเศษของคุณ)
                    const { data, error } = await db
                        .from('foods')
                        .select('*')
                        .eq('food_group_id', 98)
                        .order('name', { ascending: true });

                    if (error) throw error;
                    
                    if (data) {
                        specialMenuData = data;
                        renderPresetButtons();
                        return;
                    }
                }
            } catch (err) {
                console.error('โหลดจาก Supabase ไม่สำเร็จ:', err.message);
                showCustomAlert('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูล Supabase ได้: ' + err.message, '❌', true);
            }
        }

        function renderPresetButtons() {
            const container = document.getElementById('presetButtonsContainer');
            container.innerHTML = '';

            if (specialMenuData.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-400 col-span-3 text-center py-2">ยังไม่มีเมนูพิเศษในตาราง foods ลองเพิ่มเมนูด้านล่างได้เลยครับ</div>';
                return;
            }

            specialMenuData.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'special-preset-btn truncate';
                btn.textContent = item.name;
                
                const foodId = item.id !== undefined ? item.id : (item.food_id !== undefined ? item.food_id : '');

                btn.onclick = () => {
                    if (window.parent) {
                        window.parent.postMessage({
                            type: 'OPEN_SELECT_ITEM',
                            action: 'openSelectItem',
                            food_id: foodId,
                            name: item.name || '',
                            cat_id: '98'
                        }, '*');
                    }
                };

                container.appendChild(btn);
            });
        }

        async function saveNewSpecialMenu() {
            const nameInput = document.getElementById('customFoodName').value.trim();
            const p1 = parseFloat(document.getElementById('price1Input').value) || 0;
            const p2 = parseFloat(document.getElementById('price2Input').value) || p1;
            const p3 = parseFloat(document.getElementById('price3Input').value) || p1;

            if (!nameInput) {
                showCustomAlert('ยังไม่ได้ใส่ชื่อเมนู', 'กรุณาระบุชื่อเมนูใหม่ก่อนกดบันทึกครับ', '📌', true);
                document.getElementById('customFoodName').focus();
                return;
            }

            if (p1 <= 0 && p2 <= 0 && p3 <= 0) {
                showCustomAlert('ยังไม่ได้ระบุราคา', 'กรุณากรอกราคาอย่างน้อย 1 เรทราคาครับ', '💰', false);
                document.getElementById('price1Input').focus();
                return;
            }

            try {
                if (!db) db = getDbClient();
                if (!db) throw new Error('ไม่พบตัวเชื่อมต่อฐานข้อมูล');

                // บันทึกลงตาราง foods พร้อมกำหนด food_group_id เป็น 98 (เมนูพิเศษ)
                const { data, error } = await db.from('foods').insert([{
                    name: nameInput,
                    food_group_id: 98,
                    price_1: p1,
                    price_2: p2,
                    price_3: p3
                }]).select();

                if (error) throw error;

                // ล้างค่าในฟอร์มช่องกรอก
                document.getElementById('customFoodName').value = '';
                document.getElementById('price1Input').value = '';
                document.getElementById('price2Input').value = '';
                document.getElementById('price3Input').value = '';

                // โหลดข้อมูลใหม่จาก Supabase ทันที
                await fetchSpecialFoodsFromDB();

                const savedItem = (data && data.length > 0) ? data[0] : null;
                const foodId = savedItem ? (savedItem.id !== undefined ? savedItem.id : (savedItem.food_id !== undefined ? savedItem.food_id : '')) : '';

                // ส่ง postMessage เปิด Pop-up (selectitem.html) ต่อทันที
                if (window.parent) {
                    window.parent.postMessage({
                        type: 'OPEN_SELECT_ITEM',
                        action: 'openSelectItem',
                        food_id: foodId,
                        name: nameInput,
                        cat_id: '98'
                    }, '*');
                }

            } catch (err) {
                console.error('บันทึกลง Supabase ไม่สำเร็จ:', err);
                showCustomAlert('บันทึกไม่สำเร็จ', err.message, '❌', true);
            }
        }

        function goToOrderEntity() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'CLOSE_MODAL', action: 'closeModal' }, '*');
            } else {
                window.location.href = 'orderentity.html';
            }
        }

        function showCustomAlert(title, message, icon = '⚠️', isWarning = true) {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('alertIconBg').textContent = icon;
            document.getElementById('customAlertOverlay').classList.remove('hidden');
        }

        function closeCustomAlert() {
            document.getElementById('customAlertOverlay').classList.add('hidden');
        }
    </script>
</body>
</html>
