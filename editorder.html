  - Description: หน้าหลักระบบค้นหาออเดอร์ (เพิ่มระบบเคลียร์แคชชั่วคราวตอนกดกลับเพื่อแก้ปัญหาหน้าค้าง)
  ========================================================================

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ระบบค้นหาและแก้ไขออเดอร์ - ลาบหนองบัวลำภู</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
        }
        /* ล็อกหน้าจอห้ามซูมและห้ามสกอร์ทั้งหน้า */
        html, body { 
            width: 100%; height: 100vh; overflow: hidden;
            touch-action: none; -webkit-text-size-adjust: 100%;
            background-color: var(--bg-color); color: #1e293b;
            font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; user-select: none; 
        }
        .app-container {
            max-width: 28rem; margin: 0 auto; height: 100vh;
            display: flex; flex-direction: column; background-color: #ffffff;
            box-sizing: border-box; overflow: hidden; position: relative;
        }
        .custom-modal-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); 
            display: none; align-items: center; justify-content: center; 
            z-index: 9999; padding: 1rem; touch-action: none;
        }
        .custom-modal-overlay.active { display: flex; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased p-0 sm:p-3 flex justify-center items-center">

    <div class="app-container shadow-sm sm:rounded-3xl border border-slate-200">
        <div id="mainSearchSection" class="flex flex-col h-full w-full">
            <div class="p-4 bg-white border-b border-slate-100 space-y-3 shrink-0">
                <div class="flex items-center gap-2 pb-2 border-b border-slate-100">
                    <span class="text-xl">✏️</span>
                    <h1 class="font-extrabold text-base text-slate-800">ระบบค้นหาและแก้ไขออเดอร์</h1>
                </div>

                <div class="bg-slate-50 rounded-2xl p-2.5 border border-slate-100 space-y-1.5">
                    <div class="flex items-center gap-1.5 text-[11px] font-bold text-slate-500">
                        <span>📅</span> เลือกวันที่ต้องการค้นหา
                    </div>
                    <div class="flex gap-2 items-center" onclick="openCalendarPicker()">
                        <input type="text" id="selectedDateInput" value="" class="bg-white border border-slate-200 rounded-xl px-2 py-1.5 text-xs font-bold text-slate-700 w-full text-center shadow-xs cursor-pointer hover:bg-slate-50 transition pointer-events-none" readonly>
                        
                        <button type="button" class="bg-white border border-slate-200 text-blue-600 font-bold text-[11px] px-2.5 py-2 rounded-xl shadow-xs hover:bg-slate-50 flex items-center gap-1 whitespace-nowrap cursor-pointer active:scale-95 pointer-events-none">
                            <span>📅</span> เปลี่ยน
                        </button>
                        
                        <!-- ปุ่มกลับไปที่ index.html พร้อมเคลียร์ค่าที่อาจค้างในเซสชัน -->
                        <a href="index.html" onclick="sessionStorage.clear();" class="bg-blue-600 text-white font-bold text-[11px] px-3 py-2 rounded-xl shadow-xs hover:bg-blue-700 whitespace-nowrap cursor-pointer text-center no-underline flex items-center justify-center">
                            กลับ
                        </a>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-500 px-1">
                        <span class="flex items-center gap-1">📋 รายการออเดอร์ทั้งหมด</span>
                        <span class="bg-slate-200 text-slate-600 rounded-full px-2 py-0.5 text-[10px]" id="orderListCount">0 รายการ</span>
                    </div>

                    <div class="grid grid-cols-2 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold text-slate-500 shadow-xs">
                        <div>สถานที่ / กลุ่มลูกค้า</div>
                        <div class="text-right">ยอดรวม</div>
                    </div>
                </div>
            </div>

            <!-- ส่วนรายการที่เปิดให้ Scroll เฉพาะด้านใน -->
            <div class="flex-1 overflow-y-auto p-4 pt-1 bg-white" style="-webkit-overflow-scrolling: touch; touch-action: pan-y;">
                <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-xs" id="orderListContainer">
                    <div id="orderItemsList" class="divide-y divide-slate-100">
                        <div class="p-4 text-center text-xs text-slate-400 font-bold">กำลังโหลดข้อมูล...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal สำหรับเปิดปฏิทิน -->
    <div id="externalPageModalOverlay" class="custom-modal-overlay" onclick="closeExternalModal()">
        <div class="w-[92%] max-w-sm bg-white rounded-3xl overflow-hidden border border-slate-200 shadow-2xl flex flex-col max-h-[80vh]" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center p-3.5 bg-slate-100 border-b border-slate-200 shrink-0">
                <div class="flex items-center gap-2">
                    <span id="externalModalIcon" class="text-lg">📅</span>
                    <h2 id="externalModalTitle" class="font-extrabold text-xs text-slate-800">เลือกวันที่ออเดอร์</h2>
                </div>
                <button type="button" onclick="closeExternalModal()" class="text-slate-400 font-bold text-lg px-2 cursor-pointer">✕</button>
            </div>
            <iframe id="externalPageFrame" src="" class="w-full border-none transition-all duration-200 bg-white" style="height: 380px; max-height: 60vh;"></iframe>
        </div>
    </div>

    <script src="supabaseClient.js"></script>
    <script>
        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

        let db;
        let allOrdersCache = [];
        let locationsData = [];
        let selectedDateFormatted = '';

        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof window.supabaseClient !== 'undefined') {
                db = window.supabaseClient;
            }
            setSelectedDate(new Date());
            await loadMasterData();
            await loadAllOrdersAndRender();
        });

        function setSelectedDate(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            selectedDateFormatted = `${year}-${month}-${day}`;
            const dateInput = document.getElementById('selectedDateInput');
            if (dateInput) dateInput.value = `${day}/${month}/${year + 543}`;
        }

        function openCalendarPicker() {
            const countsMap = {};
            allOrdersCache.forEach(item => {
                const rawDate = item.created_at || item.order_date || item.date || item.timestamp || '';
                const d = String(rawDate).split('T')[0].split(' ')[0];
                if (d) countsMap[d] = (countsMap[d] || 0) + 1;
            });
            sessionStorage.setItem('calendarEventsData', JSON.stringify(countsMap));
            document.getElementById('externalPageFrame').src = 'calendar.html';
            document.getElementById('externalPageModalOverlay').classList.add('active');
        }

        function closeExternalModal() {
            document.getElementById('externalPageModalOverlay').classList.remove('active');
            document.getElementById('externalPageFrame').src = '';
        }

        async function loadMasterData() {
            if (!db) return;
            try {
                const { data } = await db.from('locations').select('*');
                if (data) locationsData = data;
            } catch (err) { console.error('Error loading locations:', err); }
        }

        async function loadAllOrdersAndRender() {
            const container = document.getElementById('orderItemsList');
            if (!db) {
                container.innerHTML = `<div class="p-4 text-center text-xs text-rose-500 font-bold">ไม่พบการเชื่อมต่อฐานข้อมูล</div>`;
                return;
            }
            try {
                const { data, error } = await db.from('orders').select('*');
                if (error) throw error;
                allOrdersCache = data || [];
                renderOrdersForSelectedDate();
            } catch (err) {
                container.innerHTML = `<div class="p-4 text-center text-xs text-rose-500 font-bold">โหลดข้อมูลไม่สำเร็จ</div>`;
            }
        }

        function renderOrdersForSelectedDate() {
            const container = document.getElementById('orderItemsList');
            if (!container) return;
            container.innerHTML = '';

            const filtered = allOrdersCache.filter(item => {
                const rawDate = item.created_at || item.order_date || item.date || item.timestamp || '';
                return String(rawDate).split('T')[0].split(' ')[0] === selectedDateFormatted;
            });

            document.getElementById('orderListCount').textContent = `${filtered.length} รายการ`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400 font-bold">ไม่มีออเดอร์ในวันนี้</div>`;
                return;
            }

            filtered.forEach(order => {
                const div = document.createElement('div');
                div.className = 'grid grid-cols-2 p-3 text-xs hover:bg-slate-50 cursor-pointer transition active:bg-slate-100';
                div.onclick = () => {
                    const orderId = order.order_id || order.id;
                    window.location.href = `editorder_detail.html?id=${orderId}`;
                };
                
                let locName = 'หน้าร้าน';
                if (order.location_id) {
                    const foundLoc = locationsData.find(l => String(l.location_id || l.id) === String(order.location_id));
                    if (foundLoc) locName = foundLoc.name;
                }
                let displayLocation = order.nickname || locName;
                let typeId = Number(order.customer_type_id || 1);
                let displayGroup = typeId === 2 ? 'นักท่องเที่ยว' : (typeId === 3 ? 'สบายดี' : 'ชาวบ้าน');
                let displayPrice = order.total_price || order.price || 0;

                div.innerHTML = `
                    <div>
                        <div class="font-bold text-blue-600 text-sm truncate">${displayLocation}</div>
                        <div class="text-amber-600 font-bold text-[11px] mt-0.5">${displayGroup}</div>
                    </div>
                    <div class="text-right font-black text-slate-800 text-sm self-center">
                        ${Number(displayPrice).toLocaleString()} ฿
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.addEventListener('message', (e) => {
            if (!e.data) return;
            const action = e.data.action || e.data.type;
            if (action === 'SELECT_DATE' || e.data.selectedDate) {
                const dateStr = e.data.selectedDate || e.data.date;
                if (dateStr) {
                    const parts = dateStr.split('-');
                    if (parts.length === 3) {
                        setSelectedDate(new Date(parts[0], parts[1] - 1, parts[2]));
                        renderOrdersForSelectedDate();
                    }
                }
                closeExternalModal();
            }
        });
    </script>
</body>
</html>
