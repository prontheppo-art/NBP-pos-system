<!-- 
  ======================================================================
  ชื่อไฟล์: editorder.html
  หน้าที่: แก้ไขออร์เดอร์ (ปรับขนาดฟอนต์เท่ากัน และเปลี่ยนสีเวลาเป็นสีเข้ม)
  ======================================================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แก้ไขออร์เดอร์ - ลาบหนองบัวลำภู</title>
    <!-- Tailwind CSS & Supabase JS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
      :root { --bg-color: #f8fafc; }
      html, body { height: 100dvh; margin: 0; padding: 0; font-family: 'Sarabun', system-ui, -apple-system, sans-serif; background-color: var(--bg-color); touch-action: pan-y; -webkit-user-select: none; user-select: none; }
      .app-container { max-width: 500px; margin: 0 auto; height: 100dvh; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; }
      ::-webkit-scrollbar { display: none; }
      .group-btn-v2 { background-color: #ffffff; border: 1.5px solid #fde68a; color: #334155; transition: all 0.2s ease; }
      .group-btn-v2.active { background-color: #f59e0b; border-color: #d97706; color: #ffffff; box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3); }
      .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
      .delete-btn { color: #ef4444; font-weight: bold; font-size: 18px; padding: 0 6px; cursor: pointer; background: transparent; border: none; }

      /* CSS สำหรับส่วน Time Wheel Picker */
      .wheel::-webkit-scrollbar { display: none; }
      .wheel { -ms-overflow-style: none; scrollbar-width: none; scroll-snap-type: y mandatory; }
      
      .wheel-item { 
          height: 36px; 
          scroll-snap-align: center; 
          display: flex; 
          align-items: center; 
          justify-content: center; 
          font-size: 0.875rem; /* ขนาดเท่ากับปุ่มวันที่ (14px / text-xs) */
          font-weight: 800; 
          color: #1e293b; /* เปลี่ยนเป็นสีดำเข้ม / สีกรมท่าเข้ม */
          transition: color 0.15s ease;
      }

      .single-line-box {
          background-color: #ffffff;
          border: 1px solid #e2e8f0;
          border-radius: 0.75rem;
          box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center">

<div class="app-container shadow-2xl w-full border border-slate-100 flex flex-col">
    <!-- HEADER -->
    <div class="p-4 bg-white border-b border-slate-100 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
            <button type="button" onclick="goBackToReport()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 font-bold active:scale-95 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div>
                <h2 class="font-extrabold text-sm text-slate-800">แก้ไขรายละเอียดออเดอร์</h2>
                <p class="text-[10px] text-slate-400 font-semibold" id="editModalOrderTitle">รหัสออเดอร์: Loading...</p>
            </div>
        </div>
        <button type="button" onclick="goBackToReport()" class="text-slate-400 hover:text-slate-600 font-bold text-base px-2">✕</button>
    </div>

    <!-- BODY -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-white flex flex-col">
        <div id="editLocationSelectorWrapper" class="shrink-0"></div>

        <div class="space-y-1.5 flex-1 flex flex-col min-h-0">
            <span class="text-xs font-bold text-slate-500 shrink-0">🍱 รายการอาหารในออเดอร์</span>
            <div class="border-2 border-slate-200 rounded-2xl p-3 flex-1 overflow-y-auto space-y-2 bg-slate-50/50" id="editOrderItemsContainer">
                <div class="text-center text-slate-400 py-6 text-xs">⏳ กำลังโหลดรายการอาหาร...</div>
            </div>
        </div>

        <button type="button" onclick="openCategoryModalForEdit()" class="w-full py-3 border-2 border-dashed border-emerald-400 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold rounded-2xl flex items-center justify-center gap-2 transition active:scale-95 cursor-pointer text-sm shrink-0">
            <span>+</span> เพิ่มรายการอาหาร
        </button>
    </div>

    <!-- FOOTER ACTIONS -->
    <div class="p-4 bg-white border-t border-slate-100 space-y-3 shrink-0 shadow-lg">
        <div class="flex justify-between items-end">
            <span class="text-xs text-slate-500 font-bold" id="editCartCountText">0 รายการ | 0 ชิ้น</span>
            <div class="text-right">
                <span class="text-[10px] text-slate-400 block font-bold">ยอดรวมสุทธิ</span>
                <span class="text-lg font-black text-slate-800" id="editTotalPrice">0 บาท</span>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="goBackToReport()" class="py-2.5 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl hover:bg-slate-200 active:scale-95 transition">✕ ยกเลิก</button>
            <button type="button" onclick="deleteCurrentEditingOrder()" class="py-2.5 bg-rose-500 text-white font-bold text-xs rounded-xl shadow-md hover:bg-rose-600 active:scale-95 transition">🗑️ ลบ</button>
            <button type="button" onclick="saveOrderEditData()" class="py-2.5 bg-amber-500 text-white font-bold text-xs rounded-xl shadow-md hover:bg-amber-600 active:scale-95 transition">✏️ บันทึก</button>
        </div>
    </div>
</div>

<!-- MODAL เปิดปฏิทิน calendar.html -->
<div id="calendarModalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-[80] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="calendarModalBox" class="bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden transform scale-95 transition-transform duration-200 w-full max-w-[380px] h-[480px]">
        <div class="flex justify-between items-center px-4 py-3 bg-slate-50 border-b border-slate-100 shrink-0">
            <div class="flex items-center gap-2">
                <span class="text-base">📅</span>
                <h2 class="font-extrabold text-xs text-slate-800">เลือกวันที่ออเดอร์</h2>
            </div>
            <button type="button" onclick="toggleModal('calendarModalOverlay','calendarModalBox',false)" class="text-slate-400 hover:text-slate-600 font-bold text-base px-2">✕</button>
        </div>
        <iframe id="calendarFrame" src="" class="w-full flex-1 border-none bg-white"></iframe>
    </div>
</div>

<!-- MODAL เลือกสถานที่ / โซนย่อย -->
<div id="subLocZoneModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-[60] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white rounded-2xl p-4 w-full max-w-xs shadow-2xl flex flex-col max-h-[80vh] transform scale-95 transition-transform duration-200" id="subLocZoneBox">
        <div class="flex justify-between items-center mb-2 pb-2 border-b">
            <div>
                <h3 id="subLocZoneTitle" class="font-bold text-base text-slate-800">📍 เลือกสถานที่</h3>
                <span id="subLocZoneSubTitle" class="text-xs text-amber-600 font-semibold block"></span>
            </div>
            <button onclick="toggleModal('subLocZoneModal','subLocZoneBox',false)" class="text-gray-400 font-bold text-lg">✕</button>
        </div>
        <div id="subLocZoneGrid" class="grid grid-cols-2 gap-2 overflow-y-auto py-1 max-h-[55vh]"></div>
    </div>
</div>

<!-- MODAL Iframe สำหรับหน้าเลือกอาหาร -->
<div id="externalPageModalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-[70] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="externalPageBox" class="bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden transform scale-95 transition-transform duration-200 w-full max-w-[500px] h-[90vh]">
        <div class="flex justify-between items-center p-3.5 bg-slate-100 border-b border-slate-200 shrink-0">
            <div class="flex items-center gap-2">
                <span id="externalModalIcon" class="text-lg">🍱</span>
                <h2 id="externalModalTitle" class="font-extrabold text-sm text-slate-800">เลือกรายการอาหาร</h2>
            </div>
            <button type="button" onclick="closeExternalModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl px-3">✕</button>
        </div>
        <iframe id="externalPageFrame" src="" class="w-full flex-1 border-none bg-white"></iframe>
    </div>
</div>

<!-- CUSTOM ALERT / CONFIRM MODAL -->
<div id="customAlertModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-[100] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl overflow-hidden p-5 text-center transform scale-95 transition-transform duration-200" id="customAlertBox">
        <div id="customAlertIcon" class="text-3xl mb-2">🎉</div>
        <h3 id="customAlertTitle" class="font-extrabold text-base text-slate-800 mb-1">แจ้งเตือน</h3>
        <p id="customAlertMessage" class="text-xs text-slate-600 mb-5 leading-relaxed font-medium">ข้อความ...</p>
        <div id="customAlertButtons" class="flex gap-2"></div>
    </div>
</div>

<script>
    let db = null, targetOrderId = null, currentEditingOrder = null;
    let currentEditingOrderItems = [], locationsCache = [], zonesCache = [], foodsCache = [];
    let locationFoodPricesMap = {}, isDeliveryFeeWaived = false, savedMainCart = null;
    let selectedOrderDate = '', curH = '00', curM = '00';
    const ITEM_HEIGHT = 36; // ความสูง 1 บรรทัดของวงล้อ

    function toggleModal(modalId, boxId, show = true) {
        const m = document.getElementById(modalId), b = document.getElementById(boxId);
        if(!m || !b) return;
        if(show) { m.classList.remove('opacity-0', 'pointer-events-none'); b.classList.remove('scale-95'); }
        else { m.classList.add('opacity-0', 'pointer-events-none'); b.classList.add('scale-95'); }
    }

    function showAlert(title, message, icon = '🎉', onOk = null, isConfirm = false) {
        document.getElementById('customAlertTitle').textContent = title;
        document.getElementById('customAlertMessage').textContent = message;
        document.getElementById('customAlertIcon').textContent = icon;
        const btns = document.getElementById('customAlertButtons');
        
        if(!isConfirm) {
            btns.innerHTML = `<button type="button" class="w-full py-2.5 bg-amber-500 text-white font-bold text-xs rounded-xl shadow-md">ตกลง</button>`;
            btns.firstElementChild.onclick = () => { toggleModal('customAlertModal','customAlertBox',false); if(onOk) onOk(); };
        } else {
            btns.innerHTML = `
                <button type="button" class="flex-1 py-2.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl">ยกเลิก</button>
                <button type="button" class="flex-1 py-2.5 bg-rose-500 text-white font-bold text-xs rounded-xl shadow-md">ยืนยัน</button>`;
            btns.children[0].onclick = () => toggleModal('customAlertModal','customAlertBox',false);
            btns.children[1].onclick = () => { toggleModal('customAlertModal','customAlertBox',false); if(onOk) onOk(); };
        }
        toggleModal('customAlertModal','customAlertBox',true);
    }

    window.onload = async function() {
        targetOrderId = new URLSearchParams(window.location.search).get('order_id');
        if (!targetOrderId) return showAlert('แจ้งเตือน', 'ไม่พบรหัสออร์เดอร์', '⚠️', goBackToReport);

        db = window.supabaseClient || supabaseClient;
        renderEditLocationComponent('editLocationSelectorWrapper');
        await fetchMasterDataAndOrder();
    };

    function goBackToReport() {
        if (document.referrer && document.referrer.includes(window.location.host)) window.history.back();
        else window.location.href = 'salesreport.html';
    }

    function formatThaiDateDisplay(dateStr) {
        if (!dateStr) return 'เลือกวันที่';
        const [y, m, d] = dateStr.split('-');
        const thaiMonthsShort = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
        return `${parseInt(d)} ${thaiMonthsShort[parseInt(m)-1]} ${parseInt(y)+543}`;
    }

    async function fetchMasterDataAndOrder() {
        if (!db) return;
        try {
            const [locRes, zoneRes, foodRes, priceRes, orderRes] = await Promise.all([
                db.from('locations').select('*').order('name'),
                db.from('zones').select('*').order('name'),
                db.from('foods').select('*').order('food_id'),
                db.from('location_food_prices').select('*'),
                db.from('orders').select('*').eq('order_id', targetOrderId).single()
            ]);

            locationsCache = locRes.data || [];
            zonesCache = zoneRes.data || [];
            foodsCache = foodRes.data || [];
            if (priceRes.data) priceRes.data.forEach(i => locationFoodPricesMap[`${i.location_id}_${i.food_id}`] = Number(i.custom_price || 0));

            if (orderRes.error || !orderRes.data) return showAlert('ข้อผิดพลาด', 'ไม่พบข้อมูลออร์เดอร์', '❌', goBackToReport);

            currentEditingOrder = orderRes.data;
            document.getElementById('editModalOrderTitle').textContent = `รหัสออเดอร์: #${targetOrderId}`;

            if (currentEditingOrder.created_at) {
                const d = new Date(currentEditingOrder.created_at);
                selectedOrderDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                curH = String(d.getHours()).padStart(2,'0');
                curM = String(d.getMinutes()).padStart(2,'0');
                
                document.getElementById('editOrderDateBtnText').textContent = formatThaiDateDisplay(selectedOrderDate);

                // ตั้งค่าเลื่อนตำแหน่งวงล้อเวลาชั่วโมง-นาที
                const wheelH = document.getElementById('wheelH');
                const wheelM = document.getElementById('wheelM');
                if(wheelH && wheelM) {
                    scrollToValue(wheelH, parseInt(curH, 10));
                    scrollToValue(wheelM, parseInt(curM, 10));
                }
            }

            const typeId = Number(currentEditingOrder.customer_type_id || 1);
            selectEditCustomerGroup(typeId);

            if (currentEditingOrder.nickname) document.getElementById('editCustomerInput').value = currentEditingOrder.nickname;

            if (typeId === 2 && currentEditingOrder.location_id) {
                const foundLoc = locationsCache.find(l => String(l.location_id || l.id) === String(currentEditingOrder.location_id));
                if (foundLoc) {
                    document.getElementById('editSelectedLocationId').value = foundLoc.location_id || foundLoc.id;
                    let txt = foundLoc.name;
                    if (currentEditingOrder.zone_id) {
                        const foundZone = zonesCache.find(z => String(z.zone_id || z.id) === String(currentEditingOrder.zone_id));
                        if (foundZone) {
                            document.getElementById('editSelectedZoneId').value = foundZone.zone_id || foundZone.id;
                            txt += ` - ${foundZone.name}`;
                        }
                    }
                    document.getElementById('editLocationBtnText').innerText = txt;
                }
            }

            currentEditingOrderItems = typeof currentEditingOrder.items === 'string' ? JSON.parse(currentEditingOrder.items) : (currentEditingOrder.items || []);
            renderEditOrderModalItems();
        } catch (err) {
            showAlert('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้', '❌', goBackToReport);
        }
    }

    function renderEditLocationComponent(containerId) {
        document.getElementById(containerId).innerHTML = `
            <div class="space-y-2.5">
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="selectEditCustomerGroup(1)" id="btn-group-1" class="group-btn-v2 active h-[42px] rounded-xl font-bold text-xs">🏡 ชาวบ้าน</button>
                    <button type="button" onclick="selectEditCustomerGroup(2)" id="btn-group-2" class="group-btn-v2 h-[42px] rounded-xl font-bold text-xs">🧳 นักท่องเที่ยว</button>
                    <button type="button" onclick="selectEditCustomerGroup(3)" id="btn-group-3" class="group-btn-v2 h-[42px] rounded-xl font-bold text-xs">😊 สบายดี</button>
                </div>
                <div class="flex gap-2 items-center">
                    <input type="text" id="editCustomerInput" placeholder="ชื่อ หรือ เบอร์โทรศัพท์ลูกค้า" class="flex-1 h-[42px] pl-3 border border-slate-200 rounded-xl text-xs outline-none focus:border-amber-500 font-medium">
                    <div id="editLocationBtnContainer" class="w-5/12 hidden">
                        <button type="button" onclick="openSubLocationModal()" class="w-full h-[42px] bg-amber-500 text-white font-bold px-2 rounded-xl text-xs flex items-center justify-center gap-1 shadow-xs">
                            📍 <span id="editLocationBtnText" class="truncate">เลือกสถานที่</span>
                        </button>
                    </div>
                </div>

                <!-- ส่วนเลือกวันที่ + ฝัง Time Wheel Picker (ปรับฟอนต์เท่ากัน และเปลี่ยนเป็นสีเข้ม) -->
                <div class="grid grid-cols-12 gap-2 bg-slate-50 p-2 border border-slate-200/80 rounded-2xl items-center">
                    <div class="col-span-6 flex flex-col justify-center">
                        <span class="text-[10px] font-bold text-slate-400 mb-0.5 ml-1">📅 วันที่ออเดอร์</span>
                        <button type="button" onclick="openCalendarModal()" class="w-full h-[36px] px-2.5 bg-white hover:bg-amber-50 border border-slate-200 text-slate-800 font-extrabold text-xs rounded-xl flex items-center justify-between shadow-2xs transition active:scale-95">
                            <span id="editOrderDateBtnText" class="truncate">เลือกวันที่</span>
                            <span class="text-slate-400 text-[10px]">▼</span>
                        </button>
                    </div>
                    <div class="col-span-6 flex flex-col justify-center">
                        <span class="text-[10px] font-bold text-slate-400 mb-0.5 ml-1">⏰ เวลา (เลื่อนขึ้น-ลง)</span>
                        <div class="single-line-box px-2 h-[36px] flex items-center justify-center gap-1">
                            <!-- สไลด์ชั่วโมง -->
                            <div class="relative w-10 h-[36px] overflow-hidden">
                                <div id="wheelH" class="wheel w-full h-full overflow-y-auto"></div>
                            </div>

                            <!-- เครื่องหมาย : สีเข้ม -->
                            <span class="text-xs font-black text-slate-800 pb-0.5">:</span>

                            <!-- สไลด์นาที -->
                            <div class="relative w-10 h-[36px] overflow-hidden">
                                <div id="wheelM" class="wheel w-full h-full overflow-y-auto"></div>
                            </div>

                            <span class="text-[10px] font-bold text-slate-600 self-end mb-1">น.</span>
                        </div>
                    </div>
                </div>

                <input type="hidden" id="editCustomerGroupSelect" value="1">
                <input type="hidden" id="editSelectedLocationId" value="">
                <input type="hidden" id="editSelectedZoneId" value="">
            </div>`;

        // สร้างวงล้อหลังจาก Render HTML เสร็จ
        initTimeWheels();
    }

    function initTimeWheels() {
        const wheelH = document.getElementById('wheelH');
        const wheelM = document.getElementById('wheelM');
        if(!wheelH || !wheelM) return;

        buildWheel(wheelH, 24);
        buildWheel(wheelM, 60);

        setTimeout(() => {
            scrollToValue(wheelH, parseInt(curH, 10));
            scrollToValue(wheelM, parseInt(curM, 10));
        }, 50);

        setupScrollListener(wheelH, 23, (val) => curH = val);
        setupScrollListener(wheelM, 59, (val) => curM = val);
    }

    function buildWheel(container, count) {
        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const item = document.createElement('div');
            item.className = 'wheel-item';
            item.textContent = String(i).padStart(2, '0');
            container.appendChild(item);
        }
    }

    function setupScrollListener(container, maxIdx, onSelect) {
        let timer = null;
        container.onscroll = () => {
            let idx = Math.min(Math.max(Math.round(container.scrollTop / ITEM_HEIGHT), 0), maxIdx);
            let val = String(idx).padStart(2, '0');
            onSelect(val);

            clearTimeout(timer);
            timer = setTimeout(() => {
                container.scrollTo({ top: idx * ITEM_HEIGHT, behavior: 'smooth' });
            }, 100);
        };
    }

    function scrollToValue(container, index) {
        container.scrollTop = index * ITEM_HEIGHT;
    }

    function openCalendarModal() {
        document.getElementById('calendarFrame').src = 'calendar.html';
        toggleModal('calendarModalOverlay', 'calendarModalBox', true);
    }

    function selectEditCustomerGroup(groupId) {
        document.getElementById('editCustomerGroupSelect').value = groupId;
        document.querySelectorAll('.group-btn-v2').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-group-${groupId}`)?.classList.add('active');

        const locContainer = document.getElementById('editLocationBtnContainer');
        if (groupId === 2) locContainer.classList.remove('hidden');
        else {
            locContainer.classList.add('hidden');
            document.getElementById('editSelectedLocationId').value = '';
            document.getElementById('editSelectedZoneId').value = '';
        }
        if (currentEditingOrderItems.length > 0) renderEditOrderModalItems();
    }

    function openSubLocationModal() {
        document.getElementById('subLocZoneTitle').textContent = '📍 เลือกสถานที่ / ที่พัก';
        document.getElementById('subLocZoneSubTitle').textContent = '';
        const grid = document.getElementById('subLocZoneGrid');
        grid.innerHTML = '';
        locationsCache.forEach(loc => {
            const btn = document.createElement('button');
            btn.className = 'p-2.5 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl font-bold text-xs text-slate-800';
            btn.textContent = loc.name;
            btn.onclick = () => openSubZoneModal(loc);
            grid.appendChild(btn);
        });
        toggleModal('subLocZoneModal', 'subLocZoneBox', true);
    }

    function openSubZoneModal(loc) {
        document.getElementById('subLocZoneTitle').textContent = '🏷️ เลือกโซน / ห้องพัก';
        document.getElementById('subLocZoneSubTitle').textContent = `📍 สถานที่: ${loc.name}`;
        const grid = document.getElementById('subLocZoneGrid');
        grid.innerHTML = '';
        const targetLocId = loc.location_id || loc.id;
        const filtered = zonesCache.filter(z => String(z.location_id) === String(targetLocId));

        filtered.forEach(zone => {
            const btn = document.createElement('button');
            btn.className = 'col-span-2 py-2 px-3 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-xl font-bold text-xs text-slate-800 text-left';
            btn.textContent = zone.name;
            btn.onclick = () => {
                document.getElementById('editSelectedLocationId').value = targetLocId;
                document.getElementById('editSelectedZoneId').value = zone.zone_id || zone.id;
                document.getElementById('editLocationBtnText').textContent = `${loc.name} - ${zone.name}`;
                toggleModal('subLocZoneModal', 'subLocZoneBox', false);
                renderEditOrderModalItems();
            };
            grid.appendChild(btn);
        });
    }

    function getGroupBasePriceForEdit(item, groupId) {
        const foodId = item.food_id || item.id;
        const currentLocId = document.getElementById('editSelectedLocationId').value;

        if (currentLocId && foodId && locationFoodPricesMap[`${currentLocId}_${foodId}`] > 0) {
            return Number(locationFoodPricesMap[`${currentLocId}_${foodId}`]);
        }
        if (item.isCustomPrice || item.is_custom_price || item.is_custom) return Number(item.custom_price || item.price || 0);
        if (String(foodId) === '9999') return Number(item.price || 0);

        const foodObj = foodsCache.find(f => String(f.food_id || f.id) === String(foodId));
        if (foodObj) {
            const prices = [foodObj.price_1, foodObj.price_2, foodObj.price_3].map(Number);
            return prices[groupId - 1] > 0 ? prices[groupId - 1] : (prices[0] || Number(item.price || 0));
        }
        return Number(item.price || 0);
    }

    function renderEditOrderModalItems() {
        const container = document.getElementById('editOrderItemsContainer');
        container.innerHTML = '';
        let totalCartPrice = 0, totalQty = 0;
        const customerType = Number(document.getElementById('editCustomerGroupSelect').value || 1);
        const locationId = document.getElementById('editSelectedLocationId').value;

        if (currentEditingOrderItems.length === 0) {
            container.innerHTML = `<div class="text-center text-slate-400 py-6 text-xs">📭 ยังไม่มีรายการอาหารในบิลนี้</div>`;
            document.getElementById('editCartCountText').textContent = `0 รายการ | 0 ชิ้น`;
            document.getElementById('editTotalPrice').textContent = `0 บาท`;
            return;
        }

        currentEditingOrderItems.forEach((item, index) => {
            let q = Number(item.qty || item.quantity || 1);
            let basePrice = getGroupBasePriceForEdit(item, customerType);
            let daoQty = Number(item.friedEggQty || item.khaiDaoQty || 0);
            let jiaoQty = Number(item.omeletQty || item.khaiJiaoQty || 0);
            let unitPrice = basePrice + (daoQty * 10) + (jiaoQty * 10);
            let sub = unitPrice * q;

            item.price = basePrice; item.unit_price = unitPrice; item.total_price = sub;
            totalQty += q; totalCartPrice += sub;

            let details = [];
            if ((item.isCustomPrice || item.is_custom) && basePrice > 0) details.push(`⭐ ราคาพิเศษ ${basePrice}.-`);
            if (daoQty > 0) details.push(`ไข่ดาว ${daoQty}`);
            if (jiaoQty > 0) details.push(`ไข่เจียว ${jiaoQty}`);
            if (item.note || item.comment) details.push(item.note || item.comment);

            const row = document.createElement('div');
            row.className = 'cart-item-row text-xs';
            row.innerHTML = `
                <div class="flex-1 pr-2 flex items-center gap-1">
                    <button type="button" onclick="currentEditingOrderItems.splice(${index},1); renderEditOrderModalItems();" class="delete-btn text-sm">&times;</button>
                    <div>
                        <span class="font-bold text-slate-800">${q}x ${item.name || item.food_name || 'รายการ'}</span> 
                        <span class="text-amber-600 font-semibold">${details.length ? ` (${details.join(', ')})` : ''}</span>
                    </div>
                </div>
                <span class="font-extrabold text-slate-900">${sub}.-</span>`;
            container.appendChild(row);
        });

        let deliveryFee = 0;
        const currentLocObj = locationsCache.find(l => String(l.location_id || l.id) === String(locationId));
        if (customerType === 2 && currentLocObj && !currentLocObj.name.includes('หน้าร้าน') && !isDeliveryFeeWaived) {
            const minOrder = Number(currentLocObj.min_order_for_free_delivery) || 300;
            if (totalCartPrice < minOrder) deliveryFee = Number(currentLocObj.delivery_fee) || 20;
        }

        if (deliveryFee > 0) {
            const deliveryRow = document.createElement('div');
            deliveryRow.className = 'cart-item-row bg-amber-50/60 p-2 rounded-xl border border-amber-100 text-xs';
            deliveryRow.innerHTML = `
                <div class="flex-1 flex items-center gap-1"><span>🛵</span><span class="font-bold text-amber-900">ค่าบริการจัดส่ง</span></div>
                <div class="flex items-center gap-3">
                    <span class="font-extrabold text-amber-900">${deliveryFee}.-</span>
                    <button type="button" onclick="isDeliveryFeeWaived=true; renderEditOrderModalItems();" class="delete-btn">&times;</button>
                </div>`;
            container.appendChild(deliveryRow);
        }

        document.getElementById('editCartCountText').textContent = `${currentEditingOrderItems.length} รายการ | ${totalQty} ชิ้น`;
        document.getElementById('editTotalPrice').textContent = `${(totalCartPrice + deliveryFee).toLocaleString()} บาท`;
    }

    function openCategoryModalForEdit() {
        savedMainCart = localStorage.getItem('cart');
        localStorage.removeItem('cart');
        document.getElementById('externalModalIcon').textContent = '🍱';
        document.getElementById('externalModalTitle').textContent = 'เลือกรายการอาหาร';
        document.getElementById('externalPageFrame').src = 'foodselect.html?mode=edit';
        toggleModal('externalPageModalOverlay', 'externalPageBox', true);
    }

    function closeExternalModal(eventData) {
        toggleModal('externalPageModalOverlay', 'externalPageBox', false);
        document.getElementById('externalPageFrame').src = '';

        if (eventData) {
            if (eventData.item) currentEditingOrderItems.push(eventData.item);
            else if (Array.isArray(eventData.cart)) eventData.cart.forEach(i => currentEditingOrderItems.push(i));
        } else {
            try {
                const newlyAdded = JSON.parse(localStorage.getItem('cart') || '[]');
                if (Array.isArray(newlyAdded)) newlyAdded.forEach(i => currentEditingOrderItems.push(i));
            } catch(e) {}
        }

        if (savedMainCart !== null) localStorage.setItem('cart', savedMainCart);
        else localStorage.removeItem('cart');

        renderEditOrderModalItems();
    }

    window.addEventListener('message', function(e) {
        if (!e.data) return;
        const d = e.data;

        // รับค่าวันที่จาก calendar.html
        if (d.action === 'SELECT_DATE' && d.selectedDate) {
            selectedOrderDate = d.selectedDate;
            document.getElementById('editOrderDateBtnText').textContent = formatThaiDateDisplay(selectedOrderDate);
            toggleModal('calendarModalOverlay', 'calendarModalBox', false);
            return;
        }

        if (d.action === 'CLOSE_MODAL' && e.source === document.getElementById('calendarFrame')?.contentWindow) {
            toggleModal('calendarModalOverlay', 'calendarModalBox', false);
            return;
        }

        if (d.type === 'OPEN_SELECT_FOOD' || d.action === 'OPEN_SELECT_FOOD') {
            document.getElementById('externalModalIcon').textContent = '🍲';
            document.getElementById('externalModalTitle').textContent = `เลือกอาหาร: ${d.catName || ''}`;
            document.getElementById('externalPageFrame').src = `selectfood.html?cat_id=${d.catId || d.category?.id}&mode=edit`;
        } else if (d.type === 'OPEN_SPECIAL_MENU' || d.action === 'openSpecialMenu') {
            document.getElementById('externalModalIcon').textContent = '⭐';
            document.getElementById('externalModalTitle').textContent = 'เพิ่มเมนูพิเศษ';
            document.getElementById('externalPageFrame').src = `specialmenu.html?mode=edit`;
        } else if (['CLOSE_MODAL', 'closeModal', 'ADD_TO_CART_SUCCESS', 'CLOSE_EXTERNAL_MODAL'].includes(d.type || d.action)) {
            closeExternalModal(d);
        }
    });

    async function saveOrderEditData() {
        if (!targetOrderId) return;
        try {
            const customerType = Number(document.getElementById('editCustomerGroupSelect').value || 1);
            const namePhone = document.getElementById('editCustomerInput').value.trim();
            const locationId = document.getElementById('editSelectedLocationId').value || null;
            const zoneId = document.getElementById('editSelectedZoneId').value || null;
            
            // อ่านค่าเวลาตรงจากวงล้อสไลด์
            const timeVal = `${curH}:${curM}`;

            let subtotal = currentEditingOrderItems.reduce((sum, item) => sum + Number(item.total_price || 0), 0);
            let deliveryFee = 0;
            const currentLocObj = locationsCache.find(l => String(l.location_id || l.id) === String(locationId));
            if (customerType === 2 && currentLocObj && !currentLocObj.name.includes('หน้าร้าน') && !isDeliveryFeeWaived) {
                if (subtotal < (Number(currentLocObj.min_order_for_free_delivery) || 300)) deliveryFee = Number(currentLocObj.delivery_fee) || 20;
            }

            const updatePayload = {
                customer_type_id: customerType,
                nickname: namePhone,
                location_id: locationId ? Number(locationId) : null,
                zone_id: zoneId ? Number(zoneId) : null,
                items: JSON.stringify(currentEditingOrderItems),
                subtotal: subtotal,
                delivery_fee: deliveryFee,
                total_price: subtotal + deliveryFee,
                total_qty: currentEditingOrderItems.reduce((sum, item) => sum + Number(item.qty || 1), 0)
            };

            if (selectedOrderDate) {
                updatePayload.created_at = new Date(`${selectedOrderDate}T${timeVal}:00`).toISOString();
            }

            const { error } = await db.from('orders').update(updatePayload).eq('order_id', targetOrderId);
            if (error) throw error;
            showAlert('สำเร็จ', 'บันทึกการแก้ไขเรียบร้อยแล้ว!', '🎉', goBackToReport);
        } catch (err) {
            showAlert('เกิดข้อผิดพลาด', err.message, '❌');
        }
    }

    async function deleteCurrentEditingOrder() {
        if (!targetOrderId) return;
        showAlert('ยืนยันการลบ', `คุณต้องการลบออเดอร์ #${targetOrderId} ใช่หรือไม่?`, '🗑', async () => {
            try {
                const { error } = await db.from('orders').delete().eq('order_id', targetOrderId);
                if (error) throw error;
                showAlert('สำเร็จ', 'ลบออเดอร์เรียบร้อยแล้ว', '🗑️', goBackToReport);
            } catch (err) {
                showAlert('เกิดข้อผิดพลาด', err.message, '❌');
            }
        }, true);
    }
</script>
