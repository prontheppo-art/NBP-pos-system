<!-- ไฟล์: adjus_schema.html -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Supabase - Data Explorer & SQL Exporter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      touch-action: manipulation;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-modal {
      animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen p-4 pt-24 relative">

  <!-- ซ่อน Textarea เบื้องหลัง -->
  <div class="hidden">
    <textarea id="sqlOutput"></textarea>
  </div>

  <!-- แถบควบคุม Sticky Header บนสุด -->
  <div class="fixed top-0 left-0 right-0 bg-zinc-950/95 backdrop-blur-md border-b border-zinc-800 p-3 z-40 shadow-xl">
    <div class="max-w-7xl mx-auto space-y-2">
      <div class="grid grid-cols-4 gap-2">
        <a href="admin_index.html" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight no-underline">
          <span>🔙</span>
          <span>หน้า Admin</span>
        </a>
        <button onclick="fetchAllTablesData()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight">
          <span>🚀</span>
          <span>ดึงตาราง</span>
        </button>
        <button onclick="exportSchemaOnly()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight">
          <span>⚡</span>
          <span>คัดลอก schema.sql</span>
        </button>
        <button onclick="exportFullBackup()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight">
          <span>💾</span>
          <span>คัดลอก schema_data.sql</span>
        </button>
      </div>

      <!-- ข้อความแสดงสถานะ -->
      <div id="statusText" class="text-[11px] font-semibold text-center text-zinc-400 truncate">
        พร้อมใช้งานระบบ (แก้ไขการสร้าง Primary Key ครบทุกจุดแล้ว)
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Container สำหรับแสดงผลตาราง -->
    <div id="tablesContainer" class="space-y-8"></div>
  </div>

  <!-- CUSTOM MODAL DIALOG BOX -->
  <div id="customModalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity duration-200">
    <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-5 animate-modal relative overflow-hidden">
      
      <div id="modalGlow" class="absolute -top-12 -right-12 w-32 h-32 bg-emerald-500/10 blur-2xl rounded-full pointer-events-none"></div>

      <div class="flex items-start gap-4">
        <div id="modalIconContainer" class="p-3 bg-zinc-800 rounded-xl shrink-0 text-2xl border border-zinc-700">
          ⚠️
        </div>
        <div class="space-y-1">
          <h3 id="modalTitle" class="text-base font-bold text-white leading-tight">แจ้งเตือนระบบ</h3>
          <p id="modalSubtitle" class="text-xs text-zinc-400">การดำเนินการเสร็จสิ้น</p>
        </div>
      </div>

      <div id="modalBody" class="text-xs text-zinc-300 bg-black/60 border border-zinc-800 rounded-xl p-3.5 leading-relaxed font-normal whitespace-pre-line">
        ข้อความแจ้งเตือนจะแสดงที่นี่...
      </div>

      <div class="flex justify-end gap-2.5 pt-1">
        <button id="modalCancelBtn" onclick="closeCustomModal(false)" class="hidden px-4 py-2 rounded-xl text-xs font-semibold text-zinc-300 bg-zinc-800 hover:bg-zinc-700 transition active:scale-95">
          ยกเลิก
        </button>
        <button id="modalConfirmBtn" onclick="closeCustomModal(true)" class="px-5 py-2 rounded-xl text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-500 transition active:scale-95 shadow-md">
          ตกลง
        </button>
      </div>

    </div>
  </div>

  <script src="supabaseClient.js"></script>
  
  <script>
    let modalResolver = null;
    let tablesDataCache = {}; 

    // Mapping ชื่อ Primary Key ของแต่ละตารางตาม schema จริง
    const primaryKeyMap = {
      'customer_types': 'customer_type_id',
      'customers': 'customer_id',
      'food_groups': 'food_group_id',
      'foods': 'food_id',
      'locations': 'location_id',
      'orders': 'order_id',
      'zones': 'zone_id'
    };

    function showCustomModal({ title, subtitle, message, type = 'info', isConfirm = false }) {
      return new Promise((resolve) => {
        modalResolver = resolve;

        const overlay = document.getElementById('customModalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const modalBody = document.getElementById('modalBody');
        const modalIcon = document.getElementById('modalIconContainer');
        const modalGlow = document.getElementById('modalGlow');
        const cancelBtn = document.getElementById('modalCancelBtn');
        const confirmBtn = document.getElementById('modalConfirmBtn');

        modalTitle.innerText = title || 'แจ้งเตือน';
        modalSubtitle.innerText = subtitle || 'Supabase Data Explorer';
        modalBody.innerHTML = message;

        if (type === 'warning') {
          modalIcon.innerHTML = '⚠️';
          modalIcon.className = "p-3 bg-amber-500/10 text-amber-400 rounded-xl shrink-0 text-2xl border border-amber-500/30";
          modalGlow.className = "absolute -top-12 -right-12 w-32 h-32 bg-amber-500/15 blur-2xl rounded-full pointer-events-none";
          confirmBtn.className = "px-5 py-2 rounded-xl text-xs font-semibold text-white bg-amber-600 hover:bg-amber-500 transition active:scale-95 shadow-md";
        } else if (type === 'danger') {
          modalIcon.innerHTML = '🗑️';
          modalIcon.className = "p-3 bg-rose-500/10 text-rose-400 rounded-xl shrink-0 text-2xl border border-rose-500/30";
          modalGlow.className = "absolute -top-12 -right-12 w-32 h-32 bg-rose-500/15 blur-2xl rounded-full pointer-events-none";
          confirmBtn.className = "px-5 py-2 rounded-xl text-xs font-semibold text-white bg-rose-600 hover:bg-rose-500 transition active:scale-95 shadow-md";
        } else if (type === 'success') {
          modalIcon.innerHTML = '✅';
          modalIcon.className = "p-3 bg-emerald-500/10 text-emerald-400 rounded-xl shrink-0 text-2xl border border-emerald-500/30";
          modalGlow.className = "absolute -top-12 -right-12 w-32 h-32 bg-emerald-500/15 blur-2xl rounded-full pointer-events-none";
          confirmBtn.className = "px-5 py-2 rounded-xl text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-500 transition active:scale-95 shadow-md";
        } else {
          modalIcon.innerHTML = '💡';
          modalIcon.className = "p-3 bg-blue-500/10 text-blue-400 rounded-xl shrink-0 text-2xl border border-blue-500/30";
          modalGlow.className = "absolute -top-12 -right-12 w-32 h-32 bg-blue-500/15 blur-2xl rounded-full pointer-events-none";
          confirmBtn.className = "px-5 py-2 rounded-xl text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 transition active:scale-95 shadow-md";
        }

        if (isConfirm) {
          cancelBtn.classList.remove('hidden');
        } else {
          cancelBtn.classList.add('hidden');
        }

        overlay.classList.remove('hidden');
      });
    }

    function closeCustomModal(result) {
      const overlay = document.getElementById('customModalOverlay');
      overlay.classList.add('hidden');
      if (modalResolver) {
        modalResolver(result);
        modalResolver = null;
      }
    }

    async function getAllTableNames() {
      try {
        const { data, error } = await supabaseClient.rpc('get_all_tables');
        if (error || !data || data.length === 0) return [];
        return data.map(item => item.table_name);
      } catch (err) {
        return [];
      }
    }

    async function fetchAllTablesData() {
      const status = document.getElementById('statusText');
      const container = document.getElementById('tablesContainer');
      
      status.innerHTML = "⏳ กำลังค้นหาตารางทั้งหมดในระบบ...";
      
      const tableList = await getAllTableNames();
      if (tableList.length === 0) {
        status.innerHTML = `<span class="text-rose-400">❌ ไม่พบตารางในฐานข้อมูล หรือฟังก์ชัน RPC 'get_all_tables' มีปัญหา</span>`;
        return;
      }

      status.innerHTML = `⏳ กำลังดึงข้อมูลจาก ${tableList.length} ตาราง...`;
      container.innerHTML = "";
      tablesDataCache = {};
      
      let totalCount = 0;
      
      for (const tableName of tableList) {
        try {
          const { data, error } = await supabaseClient
            .from(tableName)
            .select('*');
          
          if (error) {
            renderErrorTable(tableName, error.message);
            continue;
          }
          
          tablesDataCache[tableName] = data || [];
          renderTableData(tableName, data);
          if (data) totalCount += data.length;
          
        } catch (err) {
          renderErrorTable(tableName, err.message);
        }
      }
      
      status.innerHTML = `<span class="text-emerald-400">✅ ดึงข้อมูลสำเร็จทั้งหมด ${tableList.length} ตาราง (รวม ${totalCount} รายการ)</span>`;
    }
    
    function renderTableData(tableName, rows) {
      const container = document.getElementById('tablesContainer');
      const section = document.createElement('div');
      section.className = "bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-lg space-y-3";
      
      const countText = rows ? rows.length : 0;
      let html = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-zinc-800 pb-3">
            <div class="flex items-center gap-2">
                <h2 class="text-base font-bold text-amber-400">📌 ตาราง: <span class="text-white">${tableName}</span></h2>
                <span class="bg-zinc-800 text-zinc-300 text-xs px-2.5 py-1 rounded-full border border-zinc-700">${countText} รายการ</span>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="exportSingleTableSQL('${tableName}')" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition active:scale-95 flex items-center justify-center gap-1 shadow">
                    📋 ก๊อปปี้ SQL ตารางนี้ (Schema + Data)
                </button>
                <button onclick="clearTableData('${tableName}')" class="flex-1 sm:flex-none bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition active:scale-95 flex items-center justify-center gap-1 shadow">
                    🗑️ เคลียร์ดาต้า & รีเซ็ต ID
                </button>
            </div>
        </div>
      `;
      
      if (!rows || rows.length === 0) {
        html += `<p class="text-xs text-zinc-500 py-2 italic">-- ไม่มีข้อมูลในตารางนี้ --</p>`;
      } else {
        const headers = Object.keys(rows[0]);
        
        html += `
          <div class="overflow-x-auto max-h-96">
              <table class="w-full text-left text-xs border-collapse">
                  <thead class="sticky top-0 bg-black text-emerald-400">
                      <tr>
                          ${headers.map(h => `<th class="p-2 border-b border-zinc-800 font-semibold uppercase tracking-wider">${h}</th>`).join('')}
                      </tr>
                  </thead>
                  <tbody class="divide-y divide-zinc-800 text-zinc-300">
        `;
        
        rows.forEach(row => {
          html += `<tr class="hover:bg-zinc-800/50">`;
          headers.forEach(h => {
            let val = row[h];
            if (typeof val === 'object' && val !== null) {
              val = JSON.stringify(val);
            }
            html += `<td class="p-2 whitespace-nowrap font-mono text-[11px]">${val !== null && val !== undefined ? val : '<span class="text-zinc-600">NULL</span>'}</td>`;
          });
          html += `</tr>`;
        });
        
        html += `
                  </tbody>
              </table>
          </div>
        `;
      }
      
      section.innerHTML = html;
      container.appendChild(section);
    }

    // ฟังก์ชันสร้าง SQL เฉพาะตารางเดียว (ทั้ง Schema + Data)
    async function exportSingleTableSQL(tableName) {
      const status = document.getElementById('statusText');
      status.innerHTML = `⏳ กำลังคัดลอก SQL ของตาราง ${tableName}...`;

      try {
        let rows = tablesDataCache[tableName];

        if (!rows) {
          const { data, error } = await supabaseClient
            .from(tableName)
            .select('*');
          if (!error) {
            rows = data || [];
            tablesDataCache[tableName] = rows;
          } else {
            rows = [];
          }
        }

        let sqlStatements = [
          `-- ========================================================`,
          `-- TABLE SCHEMA & DATA: public.${tableName}`,
          `-- Date: ${new Date().toLocaleString()}`,
          `-- ========================================================\n`,
          `CREATE TABLE IF NOT EXISTS public.${tableName} (`
        ];

        let colDefs = [];
        const pkName = primaryKeyMap[tableName] || 'id';

        if (rows && rows.length > 0) {
          const sampleRow = rows[0];
          Object.keys(sampleRow).forEach(col => {
            let sqlType = "TEXT";
            const val = sampleRow[col];
            
            if (col === pkName) {
              sqlType = "BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY";
            } else if (typeof val === "number") {
              sqlType = Number.isInteger(val) ? "BIGINT" : "NUMERIC";
            } else if (typeof val === "boolean") {
              sqlType = "BOOLEAN";
            } else if (typeof val === "object" && val !== null) {
              sqlType = "JSONB";
            } else if (col.includes("_at") || col.includes("date")) {
              sqlType = "TIMESTAMPTZ";
            }
            
            colDefs.push(`    ${col} ${sqlType}`);
          });
        } else {
          colDefs.push(`    ${pkName} BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY`);
        }

        sqlStatements.push(colDefs.join(",\n"));
        sqlStatements.push(`);\n`);

        if (rows && rows.length > 0) {
          sqlStatements.push(`-- DATA INSERTS: public.${tableName}`);
          const columns = Object.keys(rows[0]);
          
          rows.forEach(row => {
            const values = columns.map(h => {
              const val = row[h];
              if (val === null || val === undefined) return "NULL";
              if (typeof val === 'number' || typeof val === 'boolean') return val;
              if (typeof val === 'object') return `'${JSON.stringify(val).replace(/'/g, "''")}'::jsonb`;
              return `'${String(val).replace(/'/g, "''")}'`;
            });

            sqlStatements.push(`INSERT INTO public.${tableName} (${columns.join(', ')}) VALUES (${values.join(', ')});`);
          });
          sqlStatements.push("\n");
        }

        const finalSQL = sqlStatements.join("\n");
        await navigator.clipboard.writeText(finalSQL);

        status.innerHTML = `<span class="text-blue-300">📋 คัดลอก SQL ตาราง ${tableName} ลง Clipboard สำเร็จ!</span>`;

        await showCustomModal({
          title: 'คัดลอก SQL สำเร็จ!',
          subtitle: `ตาราง: ${tableName}`,
          message: `คัดลอกโครงสร้าง Schema และข้อมูลของตาราง <b>"${tableName}"</b> ลง Clipboard เรียบร้อยแล้ว สามารถนำไปวางใช้งานได้ทันที!`,
          type: 'success'
        });

      } catch (err) {
        status.innerHTML = `<span class="text-rose-400">❌ เกิดข้อผิดพลาดในการคัดลอก SQL</span>`;
        await showCustomModal({
          title: 'เกิดข้อผิดพลาด',
          subtitle: `ตาราง: ${tableName}`,
          message: err.message,
          type: 'warning'
        });
      }
    }

    async function clearTableData(tableName) {
      const confirmDelete = await showCustomModal({
        title: 'ยืนยันการเคลียร์ข้อมูล',
        subtitle: `ตาราง: ${tableName}`,
        message: `คุณแน่ใจหรือไม่ว่าต้องการเคลียร์ข้อมูลทั้งหมดในตาราง <b>"${tableName}"</b> ?`,
        type: 'danger',
        isConfirm: true
      });

      if (!confirmDelete) return;

      const status = document.getElementById('statusText');
      status.innerHTML = `⏳ กำลังเคลียร์ข้อมูลตาราง ${tableName}...`;

      try {
        const rows = tablesDataCache[tableName] || [];
        let deleteError = null;

        if (rows.length > 0) {
          const pkCol = primaryKeyMap[tableName] || Object.keys(rows[0])[0];
          const { error } = await supabaseClient
            .from(tableName)
            .delete()
            .not(pkCol, 'is', null);
          deleteError = error;
        }

        if (deleteError) {
          await showCustomModal({
            title: 'เกิดข้อผิดพลาดในการลบ',
            subtitle: `ตาราง: ${tableName}`,
            message: deleteError.message,
            type: 'warning'
          });
          status.innerHTML = `<span class="text-rose-400">❌ ลบตาราง ${tableName} ไม่สำเร็จ</span>`;
          return;
        }

        const sqlResetCmd = `TRUNCATE TABLE public.${tableName} RESTART IDENTITY CASCADE;`;

        await showCustomModal({
          title: 'เคลียร์ข้อมูลสำเร็จ!',
          subtitle: `ตาราง: ${tableName}`,
          message: `ลบข้อมูลในตาราง <b>"${tableName}"</b> เรียบร้อยแล้ว!\n\n<span class="text-amber-400 font-semibold">📋 ก๊อปปี้โค้ดด้านล่างนี้ไปวางรันใน Supabase -> SQL Editor เพื่อรีเซ็ต ID:</span>\n\n<div class="relative bg-black p-3 rounded-xl border border-zinc-800 text-[11px] font-mono text-emerald-400 break-all select-all">\n  ${sqlResetCmd}\n</div>\n\n<button onclick="navigator.clipboard.writeText('${sqlResetCmd}')" class="w-full mt-2 bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-1.5 rounded-lg transition text-xs flex items-center justify-center gap-1 border border-zinc-700">\n  📋 กดคัดลอกโค้ด SQL นี้\n</button>`,
          type: 'success'
        });

        fetchAllTablesData();

      } catch (err) {
        await showCustomModal({
          title: 'เกิดข้อผิดพลาด',
          subtitle: 'System Error',
          message: err.message,
          type: 'warning'
        });
      }
    }
    
    function renderErrorTable(tableName, errorMsg) {
      const container = document.getElementById('tablesContainer');
      const section = document.createElement('div');
      section.className = "bg-zinc-900 border border-rose-900/50 rounded-2xl p-5 shadow-lg space-y-2";
      section.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-rose-900/40 pb-2">
            <h2 class="text-base font-bold text-rose-400">📌 ตาราง: ${tableName}</h2>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="exportSingleTableSQL('${tableName}')" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">
                    📋 ก๊อปปี้ SQL ตารางนี้ (Schema + Data)
                </button>
                <button onclick="clearTableData('${tableName}')" class="flex-1 sm:flex-none bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">
                    🗑️ เคลียร์ดาต้า & รีเซ็ต ID
                </button>
            </div>
        </div>
        <p class="text-xs text-rose-300 bg-black/50 p-2.5 rounded-lg border border-rose-900/30">❌ เกิดข้อผิดพลาด: ${errorMsg}</p>
      `;
      container.appendChild(section);
    }

    async function generateSQLScript(includeData = false) {
      const tableList = await getAllTableNames();
      if (tableList.length === 0) return "";

      let sqlStatements = [
        "-- ========================================================",
        `-- FILE: ${includeData ? 'schema_data.sql' : 'schema.sql'}`,
        `-- Date: ${new Date().toLocaleString()}`,
        "-- ========================================================\n"
      ];

      for (const tableName of tableList) {
        try {
          const { data, error } = await supabaseClient
            .from(tableName)
            .select('*');

          if (error) continue;

          sqlStatements.push(`-- TABLE: public.${tableName}`);
          sqlStatements.push(`CREATE TABLE IF NOT EXISTS public.${tableName} (`);
          
          let colDefs = [];
          const pkName = primaryKeyMap[tableName] || 'id'; // ดึงชื่อ PK ที่ถูกต้องตามตาราง

          if (data && data.length > 0) {
            const sampleRow = data[0];
            Object.keys(sampleRow).forEach(col => {
              let sqlType = "TEXT";
              const val = sampleRow[col];
              
              if (col === pkName) {
                sqlType = "BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY";
              } else if (typeof val === "number") {
                sqlType = Number.isInteger(val) ? "BIGINT" : "NUMERIC";
              } else if (typeof val === "boolean") {
                sqlType = "BOOLEAN";
              } else if (typeof val === "object" && val !== null) {
                sqlType = "JSONB";
              } else if (col.includes("_at") || col.includes("date")) {
                sqlType = "TIMESTAMPTZ";
              }
              
              colDefs.push(`    ${col} ${sqlType}`);
            });
          } else {
            // กรณีตารางว่างเปล่า จะสร้าง Primary Key ตามชื่อที่ถูกต้องใน Map ทันที
            colDefs.push(`    ${pkName} BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY`);
          }

          sqlStatements.push(colDefs.join(",\n"));
          sqlStatements.push(`);\n`);

          if (includeData && data && data.length > 0) {
            sqlStatements.push(`-- DATA INSERTS: public.${tableName}`);
            const columns = Object.keys(data[0]);
            
            data.forEach(row => {
              const values = columns.map(h => {
                const val = row[h];
                if (val === null || val === undefined) return "NULL";
                if (typeof val === 'number' || typeof val === 'boolean') return val;
                if (typeof val === 'object') return `'${JSON.stringify(val).replace(/'/g, "''")}'::jsonb`;
                return `'${String(val).replace(/'/g, "''")}'`;
              });

              sqlStatements.push(`INSERT INTO public.${tableName} (${columns.join(', ')}) VALUES (${values.join(', ')});`);
            });
            sqlStatements.push("\n");
          }
        } catch (err) {
          console.error(`Error processing table ${tableName}:`, err);
        }
      }

      return sqlStatements.join("\n");
    }

    async function exportSchemaOnly() {
      const status = document.getElementById('statusText');
      status.innerHTML = "⏳ กำลังสร้างและคัดลอก schema.sql...";

      const schemaSQL = await generateSQLScript(false);
      if (!schemaSQL) {
        status.innerHTML = `<span class="text-rose-400">❌ ไม่สามารถคัดลอก SQL ได้</span>`;
        return;
      }

      await navigator.clipboard.writeText(schemaSQL);
      status.innerHTML = `<span class="text-amber-300">📋 คัดลอกโค้ด schema.sql ลง Clipboard สำเร็จ!</span>`;
    }

    async function exportFullBackup() {
      const status = document.getElementById('statusText');
      status.innerHTML = "⏳ กำลังสร้างและคัดลอก schema_data.sql (โครงสร้าง + ข้อมูล)...";

      const fullSQL = await generateSQLScript(true);
      if (!fullSQL) {
        status.innerHTML = `<span class="text-rose-400">❌ ไม่สามารถคัดลอก SQL ได้</span>`;
        return;
      }

      await navigator.clipboard.writeText(fullSQL);
      status.innerHTML = `<span class="text-cyan-300">📋 คัดลอกโค้ด schema_data.sql ลง Clipboard สำเร็จ!</span>`;
    }
  </script>
