<!-- ไฟล์: selectitem.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ระบุรายละเอียดอาหาร - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        html, body { 
            width: 100%; 
            min-height: 100%; 
            margin: 0; 
            padding: 0; 
            background: #ffffff; 
            font-family: 'Sarabun', sans-serif; 
            user-select: none; 
            overflow: hidden; 
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
        }
        .swal2-popup { font-family: 'Sarabun', sans-serif !important; }

        /* ปุ่มเพิ่ม/ลด จำนวน (+ -) ให้เล็กลงพอดี */
        .qty-btn {
            width: 28px; height: 28px; border-radius: 8px;
            background-color: #ffffff; border: 1px solid #cbd5e1;
            font-weight: 800; font-size: 0.85rem; color: #334155;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none;
        }
        .qty-btn:active { background-color: #e2e8f0; transform: scale(0.95); }
    </style>
</head>
<body class="p-3 flex flex-col justify-between box-border bg-white">

    <div class="space-y-3 w-full max-w-md mx-auto">

        <!-- ================= แสดงชื่อรายการอาหาร และปุ่มบันทึกมุมขวา ================= -->
        <div class="flex justify-between items-center px-1 py-1">
            <span id="foodTitleName" class="text-lg font-extrabold text-slate-900 tracking-wide truncate pr-2">
                📌 กำลังโหลด...
            </span>
            <!-- ปุ่มบันทึกย้ายมามุมขวาบน -->
            <button type="button" onclick="saveToCart()" class="bg-emerald-600 hover:bg-emerald-750 text-white font-bold px-3 py-1.5 rounded-xl text-xs shadow-md active:scale-95 transition cursor-pointer flex items-center gap-1 shrink-0">
                <span>💾 บันทึก</span>
            </button>
        </div>

        <!-- ================= ส่วนแสดงเฉพาะรายการในตะกร้าที่เป็นชื่อเมนูนี้ ================= -->
        <div id="selectedCartItemsBox" class="bg-slate-50 border border-slate-200 rounded-xl p-2 hidden">
            <div class="flex justify-between items-center mb-1">
                <span id="cartBoxTitle" class="text-[11px] text-slate-600 font-bold flex items-center gap-1">🛒 รายการเมนูนี้ที่เลือกไว้แล้ว:</span>
                <span id="selectedCartCountBadge" class="bg-emerald-600 text-white font-extrabold text-[10px] px-1.5 py-0.2 rounded-full">0 รายการ</span>
            </div>
            <div id="selectedCartList" class="space-y-1 text-[11px] text-slate-700 max-h-24 overflow-y-auto pr-0.5">
                <!-- รายการสินค้าเฉพาะเมนูปัจจุบันจะแสดงที่นี่ ไม่ปะปนกับเมนูอื่น -->
            </div>
        </div>

        <!-- ราคา และ จำนวน -->
        <div class="grid grid-cols-2 gap-2.5 items-center">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">ราคาพิเศษ (ถ้ามี)</label>
                <input type="number" id="foodPrice" placeholder="ระบุราคา" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold text-slate-800 focus:outline-none focus:border-emerald-500 text-center">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">จำนวน</label>
                <div class="flex items-center justify-between bg-slate-50 border border-slate-300 rounded-xl px-2 py-1.5">
                    <button type="button" onclick="adjustQty(-1)" class="w-7 h-7 bg-white border border-slate-200 rounded-lg text-slate-600 font-bold flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">-</button>
                    <span id="foodQty" class="font-extrabold text-sm text-slate-800">1</span>
                    <button type="button" onclick="adjustQty(1)" class="w-7 h-7 bg-white border border-slate-200 rounded-lg text-slate-600 font-bold flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">+</button>
                </div>
            </div>
        </div>

        <!-- ไข่ดาว / ไข่เจียว (แสดงเฉพาะ food_group_id ไอดี 1 หรือ 2 เท่านั้น) -->
        <div id="eggSection" class="grid grid-cols-2 gap-2.5 items-center hidden">
            <div class="bg-slate-50 border border-slate-200 p-2 rounded-xl flex items-center justify-between">
                <span class="text-xs font-bold text-slate-700">ไข่ดาว</span>
                <div class="flex items-center gap-1.5">
                    <button type="button" onclick="adjustExtra('friedEgg', -1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-slate-600 font-bold text-xs flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">-</button>
                    <span id="friedEggQty" class="font-bold text-xs text-slate-800 w-4 text-center">0</span>
                    <button type="button" onclick="adjustExtra('friedEgg', 1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-slate-600 font-bold text-xs flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">+</button>
                </div>
            </div>
            <div class="bg-slate-50 border border-slate-200 p-2 rounded-xl flex items-center justify-between">
                <span class="text-xs font-bold text-slate-700">ไข่เจียว</span>
                <div class="flex items-center gap-1.5">
                    <button type="button" onclick="adjustExtra('omelet', -1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-slate-600 font-bold text-xs flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">-</button>
                    <span id="omeletQty" class="font-bold text-xs text-slate-800 w-4 text-center">0</span>
                    <button type="button" onclick="adjustExtra('omelet', 1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-slate-600 font-bold text-xs flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">+</button>
                </div>
            </div>
        </div>

        <!-- หมายเหตุ -->
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">หมายเหตุ</label>
            <input type="text" id="foodNote" placeholder="(เช่น เผ็ดน้อย, ไม่ใส่ผัก)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-emerald-500">
        </div>

    </div>

    <script src="supabaseClient.js"></script>
    <script>
        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

        let db;
        let foodId = null;
        let foodName = '';
        let catId = null;
        let categoryName = '';
        let currentQty = 1;
        let friedEgg = 0;
        let omelet = 0;
        let defaultFoodData = {};
        const EGG_PRICE = 10;

        // ผูกเงื่อนไขไข่ดาว/ไข่เจียวด้วย food_group_id: '1' (ข้าวกล่อง) และ '2' (ข้าวผัด)
        const EGG_CATEGORY_IDS = ['1', '2'];

        function sendAutoHeight() {
            setTimeout(() => {
                const actualHeight = document.body.scrollHeight || document.documentElement.scrollHeight;
                window.parent.postMessage({
                    type: 'RESIZE_IFRAME',
                    action: 'resizeIframe',
                    height: actualHeight + 10
                }, '*');
            }, 60);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof supabaseClient !== 'undefined') db = supabaseClient;
            
            const params = new URLSearchParams(window.location.search);
            foodId = params.get('food_id');
            foodName = decodeURIComponent(params.get('name') || '');
            catId = params.get('cat_id');
            categoryName = decodeURIComponent(params.get('cat_name') || params.get('category') || '');

            if (foodId && db) {
                try {
                    let res = await db.from('foods').select('*').eq('food_id', foodId).maybeSingle();
                    if (!res.data) {
                        res = await db.from('foods').select('*').eq('id', foodId).maybeSingle();
                    }
                    if (res.data) {
                        defaultFoodData = res.data;
                        if (!foodName && res.data.name) {
                            foodName = res.data.name;
                        }
                        if (res.data.food_group_id) {
                            catId = String(res.data.food_group_id);
                        } else if (res.data.category_id) {
                            catId = String(res.data.category_id);
                        }
                    }
                } catch (e) { 
                    console.error("Error fetching food data:", e); 
                }
            }

            document.getElementById('foodTitleName').textContent = foodName ? `📌 ${foodName}` : `📌 -`;

            checkAndToggleEggSection();
            renderSelectedCartList();
            sendAutoHeight();
        });

        function checkAndToggleEggSection() {
            const eggSection = document.getElementById('eggSection');
            const isMatchId = catId && EGG_CATEGORY_IDS.includes(String(catId));
            
            if (isMatchId) {
                eggSection.classList.remove('hidden');
            } else {
                eggSection.classList.add('hidden');
                friedEgg = 0;
                omelet = 0;
            }
            sendAutoHeight();
        }

        function adjustQty(val) {
            currentQty = Math.max(1, currentQty + val);
            document.getElementById('foodQty').textContent = currentQty;
        }

        function adjustExtra(type, val) {
            if (type === 'friedEgg') {
                friedEgg = Math.max(0, friedEgg + val);
                document.getElementById('friedEggQty').textContent = friedEgg;
            } else if (type === 'omelet') {
                omelet = Math.max(0, omelet + val);
                document.getElementById('omeletQty').textContent = omelet;
            }
            sendAutoHeight();
        }

        function renderSelectedCartList() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const boxContainer = document.getElementById('selectedCartItemsBox');
            const listContainer = document.getElementById('selectedCartList');
            const badge = document.getElementById('selectedCartCountBadge');
            
            listContainer.innerHTML = '';

            const currentFoodCartItems = cart.filter(item => 
                (foodId && String(item.food_id) === String(foodId)) || 
                (foodName && String(item.name).trim() === String(foodName).trim())
            );

            if (currentFoodCartItems.length === 0) {
                boxContainer.classList.add('hidden');
                sendAutoHeight();
                return;
            }

            boxContainer.classList.remove('hidden');
            
            const totalQty = currentFoodCartItems.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
            badge.textContent = `${currentFoodCartItems.length} รายการ (${totalQty} ชิ้น)`;

            currentFoodCartItems.forEach(item => {
                let eggText = '';
                if (item.friedEggQty > 0) eggText += ` +ไข่ดาว ${item.friedEggQty}`;
                if (item.omeletQty > 0) eggText += ` +ไข่เจียว ${item.omeletQty}`;

                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs';
                div.innerHTML = `
                    <div class="font-bold text-slate-700 truncate pr-1">
                        <span class="text-emerald-600">${item.qty}x</span> ${item.name} ${item.price !== null && item.price !== undefined ? `<span class="text-amber-600">(${item.price}฿)</span>` : ''}${eggText}
                        ${item.note ? `<br><span class="text-slate-400 font-normal text-[9px]">(${item.note})</span>` : ''}
                    </div>
                    <button type="button" onclick="deleteCartItem('${item.item_id}')" class="text-rose-500 hover:text-rose-700 font-extrabold px-1.5 py-0.5 text-xs cursor-pointer">✕</button>
                `;
                listContainer.appendChild(div);
            });

            setTimeout(sendAutoHeight, 50);
        }

        function deleteCartItem(itemId) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart = cart.filter(item => String(item.item_id) !== String(itemId));
            localStorage.setItem('cart', JSON.stringify(cart));
            renderSelectedCartList();
            
            if (window.parent) {
                window.parent.postMessage({ type: 'UPDATE_CART', action: 'updateCart', cart: cart }, '*');
            }
        }

        function saveToCart() {
            const priceInput = document.getElementById('foodPrice').value;
            const price = priceInput !== "" ? parseFloat(priceInput) : null;
            
            const note = document.getElementById('foodNote').value.trim();
            const totalEggPrice = (friedEgg + omelet) * EGG_PRICE;
            
            const finalPrice = (price !== null && !isNaN(price)) ? price + totalEggPrice : null;

            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            // ตรวจสอบความถูกต้องของการเปรียบเทียบข้อมูลแบบยืดหยุ่น (String / Null Safe)
            const existingIndex = cart.findIndex(item => {
                const sameFood = (foodId && String(item.food_id) === String(foodId)) || 
                                 (foodName && String(item.name).trim() === String(foodName).trim());
                
                // ตรวจสอบราคา (แปลงเป็น String เพื่อหลีกเลี่ยง null/undefined เปรียบเทียบไม่ตรงกัน)
                const itemPriceStr = (item.price !== null && item.price !== undefined) ? String(item.price) : 'null';
                const finalPriceStr = finalPrice !== null ? String(finalPrice) : 'null';
                const samePrice = itemPriceStr === finalPriceStr;

                const sameFriedEgg = Number(item.friedEggQty || 0) === Number(friedEgg);
                const sameOmelet = Number(item.omeletQty || 0) === Number(omelet);
                const sameNote = String(item.note || '').trim() === note;

                return sameFood && samePrice && sameFriedEgg && sameOmelet && sameNote;
            });

            if (existingIndex !== -1) {
                // หากตัวเลือกเหมือนกันทุกประการ ให้บวกเพิ่มจำนวน (qty)
                cart[existingIndex].qty = Number(cart[existingIndex].qty || 0) + Number(currentQty);
                if (cart[existingIndex].price !== null && cart[existingIndex].price !== undefined) {
                    cart[existingIndex].totalPrice = cart[existingIndex].price * cart[existingIndex].qty;
                }
            } else {
                // หากไม่เหมือนกัน ให้สร้างรายการใหม่
                cart.push({
                    item_id: Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                    food_id: foodId,
                    name: foodName,
                    price: finalPrice, 
                    base_price: price, 
                    friedEggQty: friedEgg,
                    omeletQty: omelet,
                    qty: currentQty,
                    note: note,
                    totalPrice: finalPrice !== null ? finalPrice * currentQty : null,
                    food_group_id: catId,
                    is_custom: price !== null 
                });
            }

            localStorage.setItem('cart', JSON.stringify(cart));

            // รีเซ็ตค่าหน้าจอ
            document.getElementById('foodPrice').value = '';
            document.getElementById('foodNote').value = '';
            currentQty = 1;
            friedEgg = 0;
            omelet = 0;
            document.getElementById('foodQty').textContent = '1';
            document.getElementById('friedEggQty').textContent = '0';
            document.getElementById('omeletQty').textContent = '0';

            renderSelectedCartList();

            if (window.parent) {
                window.parent.postMessage({ type: 'UPDATE_CART', action: 'updateCart', cart: cart }, '*');
                window.parent.postMessage({ type: 'CLOSE_MODAL', action: 'closeModal', cart: cart }, '*');
            }
        }

        window.addEventListener('load', sendAutoHeight);
        
        window.addEventListener('message', (e) => {
            if (!e.data) return;
            const type = e.data.type || e.data.action;
            if (type === 'UPDATE_CART' || type === 'CART_UPDATED' || type === 'REFRESH_CART') {
                renderSelectedCartList();
            }
        });
    </script>
</body>
</html>
