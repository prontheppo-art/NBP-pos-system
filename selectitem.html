<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ระบุรายละเอียดอาหาร - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        html, body { 
            width: 100%; 
            min-height: 100%; 
            margin: 0; 
            padding: 0; 
            background: #ffffff; 
            font-family: 'Sarabun', sans-serif; 
            font-size: 15px !important;
            user-select: none; 
            overflow: hidden; 
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
        }
        .swal2-popup { font-family: 'Sarabun', sans-serif !important; }

        input[type="number"], input[type="text"] {
            font-size: 15px !important;
        }

        .custom-label {
            font-size: 15px !important;
            font-weight: 700;
        }

        .qty-btn {
            width: 28px; height: 28px; border-radius: 8px;
            background-color: #ffffff; border: 1px solid #cbd5e1;
            font-weight: 800; font-size: 15px; color: #334155;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none;
        }
        .qty-btn:active { background-color: #e2e8f0; transform: scale(0.95); }

        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="p-3 flex flex-col justify-between box-border bg-white">

    <div class="space-y-3 w-full max-w-md mx-auto">

        <!-- ================= แสดงชื่อรายการอาหาร และปุ่มบันทึกมุมขวา ================= -->
        <div class="flex justify-between items-center px-1 py-1">
            <span id="foodTitleName" class="font-extrabold text-slate-900 tracking-wide truncate pr-2 text-[15px]">
                📌 กำลังโหลด...
            </span>
            <button type="button" onclick="saveToCart()" class="bg-emerald-600 hover:bg-emerald-750 text-white font-bold px-3 py-1.5 rounded-xl text-[15px] shadow-md active:scale-95 transition cursor-pointer flex items-center gap-1 shrink-0">
                <span>💾 บันทึก</span>
            </button>
        </div>

        <!-- ================= ส่วนแสดงรายการในตะกร้า ================= -->
        <div id="selectedCartItemsBox" class="bg-slate-50 border border-slate-200 rounded-xl p-2 hidden">
            <div class="flex justify-between items-center mb-1">
                <span id="cartBoxTitle" class="text-[13px] text-slate-600 font-bold flex items-center gap-1">🛒 รายการเมนูนี้ที่เลือกไว้แล้ว:</span>
                <span id="selectedCartCountBadge" class="bg-emerald-600 text-white font-extrabold text-[12px] px-2 py-0.5 rounded-full">0 รายการ</span>
            </div>
            <div id="selectedCartList" class="space-y-1 text-[13px] text-slate-700 max-h-24 overflow-y-auto pr-0.5"></div>
        </div>

        <!-- ราคา และ จำนวน -->
        <div class="grid grid-cols-2 gap-2.5 items-center">
            <div>
                <label class="block custom-label text-slate-700 mb-1">ราคาพิเศษ (ถ้ามี)</label>
                <input type="number" id="foodPrice" placeholder="ระบุราคา" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800 focus:outline-none focus:border-emerald-500 text-center">
            </div>
            <div>
                <label class="block custom-label text-slate-700 mb-1">จำนวน</label>
                <div class="flex items-center justify-between bg-slate-50 border border-slate-300 rounded-xl px-2 py-1.5">
                    <button type="button" onclick="adjustQty(-1)" class="w-7 h-7 bg-white border border-slate-200 rounded-lg text-slate-600 font-bold flex items-center justify-center shadow-sm active:scale-95 cursor-pointer text-[15px]">-</button>
                    <span id="foodQty" class="font-extrabold text-[15px] text-slate-800">1</span>
                    <button type="button" onclick="adjustQty(1)" class="w-7 h-7 bg-white border border-slate-200 rounded-lg text-slate-600 font-bold flex items-center justify-center shadow-sm active:scale-95 cursor-pointer text-[15px]">+</button>
                </div>
            </div>
        </div>

        <!-- ไข่ดาว / ไข่เจียว -->
        <div id="eggSection" class="grid grid-cols-2 gap-2.5 items-center hidden">
            <div class="bg-slate-50 border border-slate-200 p-2 rounded-xl flex items-center justify-between">
                <span class="custom-label text-slate-700">ไข่ดาว</span>
                <div class="flex items-center gap-1.5">
                    <button type="button" onclick="adjustExtra('friedEgg', -1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-slate-600 font-bold text-[15px] flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">-</button>
                    <span id="friedEggQty" class="font-bold text-[15px] text-slate-800 w-4 text-center">0</span>
                    <button type="button" onclick="adjustExtra('friedEgg', 1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-slate-600 font-bold text-[15px] flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">+</button>
                </div>
            </div>
            <div class="bg-slate-50 border border-slate-200 p-2 rounded-xl flex items-center justify-between">
                <span class="custom-label text-slate-700">ไข่เจียว</span>
                <div class="flex items-center gap-1.5">
                    <button type="button" onclick="adjustExtra('omelet', -1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-slate-600 font-bold text-[15px] flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">-</button>
                    <span id="omeletQty" class="font-bold text-[15px] text-slate-800 w-4 text-center">0</span>
                    <button type="button" onclick="adjustExtra('omelet', 1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-slate-600 font-bold text-[15px] flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">+</button>
                </div>
            </div>
        </div>

        <!-- หมายเหตุ -->
        <div>
            <label class="block custom-label text-slate-700 mb-1">หมายเหตุ</label>
            <input type="text" id="foodNote" placeholder="(เช่น เผ็ดน้อย, ไม่ใส่ผัก)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-emerald-500">
        </div>

    </div>

    <script src="supabaseClient.js"></script>
    <script>
        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

        let db;
        let foodId = null;
        let foodName = '';
        let catId = null;
        let categoryName = '';
        let currentQty = 1;
        let friedEgg = 0;
        let omelet = 0;
        let defaultFoodData = {};
        const EGG_PRICE = 10;

        const EGG_CATEGORY_IDS = ['2', '3', '98'];

        function sendAutoHeight() {
            setTimeout(() => {
                const actualHeight = document.body.scrollHeight || document.documentElement.scrollHeight;
                window.parent.postMessage({
                    type: 'RESIZE_IFRAME',
                    action: 'resizeIframe',
                    height: actualHeight + 10
                }, '*');
            }, 60);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof supabaseClient !== 'undefined') db = supabaseClient;
            
            const params = new URLSearchParams(window.location.search);
            foodId = params.get('food_id');
            foodName = decodeURIComponent(params.get('name') || '');
            catId = params.get('cat_id');
            categoryName = decodeURIComponent(params.get('cat_name') || params.get('category') || '');

            if (foodId && db) {
                try {
                    let res = await db.from('foods').select('*').eq('food_id', foodId).maybeSingle();
                    if (!res.data) {
                        res = await db.from('foods').select('*').eq('id', foodId).maybeSingle();
                    }
                    if (res.data) {
                        defaultFoodData = res.data;
                        if (!foodName && res.data.name) {
                            foodName = res.data.name;
                        }
                        if (res.data.food_group_id) {
                            catId = String(res.data.food_group_id);
                        } else if (res.data.category_id) {
                            catId = String(res.data.category_id);
                        }
                    }
                } catch (e) { 
                    console.error("Error fetching food data:", e); 
                }
            }

            document.getElementById('foodTitleName').textContent = foodName ? `📌 ${foodName}` : `📌 -`;

            checkAndToggleEggSection();
            renderSelectedCartList();
            sendAutoHeight();
        });

        function checkAndToggleEggSection() {
            const eggSection = document.getElementById('eggSection');
            const isMatchId = catId && EGG_CATEGORY_IDS.includes(String(catId));
            
            if (isMatchId) {
                eggSection.classList.remove('hidden');
            } else {
                eggSection.classList.add('hidden');
                friedEgg = 0;
                omelet = 0;
            }
            sendAutoHeight();
        }

        function adjustQty(val) {
            currentQty = Math.max(1, currentQty + val);
            document.getElementById('foodQty').textContent = currentQty;
        }

        function adjustExtra(type, val) {
            if (type === 'friedEgg') {
                friedEgg = Math.max(0, friedEgg + val);
                document.getElementById('friedEggQty').textContent = friedEgg;
            } else if (type === 'omelet') {
                omelet = Math.max(0, omelet + val);
                document.getElementById('omeletQty').textContent = omelet;
            }
            sendAutoHeight();
        }

        function groupCartItems(items) {
            const map = new Map();
            items.forEach(item => {
                const priceKey = (item.price !== null && item.price !== undefined) ? String(item.price) : 'null';
                const fEggKey = Number(item.friedEggQty || 0);
                const oMelKey = Number(item.omeletQty || 0);
                const noteKey = String(item.note || '').trim();
                const nameKey = String(item.name || '').trim();

                const signature = `${nameKey}_${priceKey}_${fEggKey}_${oMelKey}_${noteKey}`;

                if (map.has(signature)) {
                    let existing = map.get(signature);
                    existing.qty += Number(item.qty || 0);
                    if (existing.price !== null && existing.price !== undefined) {
                        existing.totalPrice = existing.price * existing.qty;
                    }
                } else {
                    map.set(signature, { ...item });
                }
            });
            return Array.from(map.values());
        }

        function renderSelectedCartList() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const boxContainer = document.getElementById('selectedCartItemsBox');
            const listContainer = document.getElementById('selectedCartList');
            const badge = document.getElementById('selectedCartCountBadge');
            
            listContainer.innerHTML = '';

            let rawFilteredItems = [];

            if (String(catId) === '98') {
                rawFilteredItems = cart.filter(item => 
                    String(item.food_group_id || item.cat_id) === '98' || item.isSpecialMenu === true
                );
                document.getElementById('cartBoxTitle').textContent = `🛒 รายการเมนูพิเศษทั้งหมดในตะกร้า:`;
            } else {
                rawFilteredItems = cart.filter(item => 
                    (foodId && String(item.food_id) === String(foodId)) || 
                    (foodName && String(item.name).trim() === String(foodName).trim())
                );
                document.getElementById('cartBoxTitle').textContent = `🛒 รายการเมนูนี้ที่เลือกไว้แล้ว:`;
            }

            if (rawFilteredItems.length === 0) {
                boxContainer.classList.add('hidden');
                sendAutoHeight();
                return;
            }

            const currentFoodCartItems = groupCartItems(rawFilteredItems);

            boxContainer.classList.remove('hidden');
            
            const totalQty = currentFoodCartItems.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
            badge.textContent = `${currentFoodCartItems.length} รายการ (${totalQty} ชิ้น)`;

            currentFoodCartItems.forEach(item => {
                let eggText = '';
                if (item.friedEggQty > 0) eggText += ` +ไข่ดาว ${item.friedEggQty}`;
                if (item.omeletQty > 0) eggText += ` +ไข่เจียว ${item.omeletQty}`;

                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs';
                div.innerHTML = `
                    <div class="font-bold text-slate-700 truncate pr-1">
                        <span class="text-emerald-600">${item.qty}x</span> ${item.name} ${item.price !== null && item.price !== undefined ? `<span class="text-amber-600">(${item.price}฿)</span>` : ''}${eggText}
                        ${item.note ? `<br><span class="text-slate-400 font-normal text-[11px]">(${item.note})</span>` : ''}
                    </div>
                    <button type="button" onclick="deleteCartItemMatch('${item.name}', ${item.price}, ${item.friedEggQty || 0}, ${item.omeletQty || 0}, '${item.note || ''}')" class="text-rose-500 hover:text-rose-700 font-extrabold px-1.5 py-0.5 text-xs cursor-pointer">✕</button>
                `;
                listContainer.appendChild(div);
            });

            setTimeout(sendAutoHeight, 50);
        }

        function deleteCartItemMatch(name, price, fEgg, oMel, note) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            cart = cart.filter(item => {
                const sameName = String(item.name || '').trim() === String(name).trim();
                const itemPrice = (item.price !== null && item.price !== undefined) ? Number(item.price) : null;
                const targetPrice = (price !== null && price !== undefined && !isNaN(price)) ? Number(price) : null;
                const samePrice = itemPrice === targetPrice;
                const sameFEgg = Number(item.friedEggQty || 0) === Number(fEgg);
                const sameOMel = Number(item.omeletQty || 0) === Number(oMel);
                const sameNote = String(item.note || '').trim() === String(note).trim();

                const isMatchGroup = sameName && samePrice && sameFEgg && sameOMel && sameNote;
                return !isMatchGroup;
            });

            localStorage.setItem('cart', JSON.stringify(cart));
            renderSelectedCartList();
            
            if (window.parent) {
                window.parent.postMessage({ type: 'UPDATE_CART', action: 'updateCart', cart: cart }, '*');
            }
        }

        function saveToCart() {
            const priceInput = document.getElementById('foodPrice').value;
            const price = priceInput !== "" ? parseFloat(priceInput) : null;
            
            const note = document.getElementById('foodNote').value.trim();
            const totalEggPrice = (friedEgg + omelet) * EGG_PRICE;
            
            const finalPrice = (price !== null && !isNaN(price)) ? price + totalEggPrice : null;

            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            const existingIndex = cart.findIndex(item => {
                const sameFood = (foodId && String(item.food_id) === String(foodId)) || 
                                 (foodName && String(item.name).trim() === String(foodName).trim());
                
                const itemPriceStr = (item.price !== null && item.price !== undefined) ? String(item.price) : 'null';
                const finalPriceStr = finalPrice !== null ? String(finalPrice) : 'null';
                const samePrice = itemPriceStr === finalPriceStr;

                const sameFriedEgg = Number(item.friedEggQty || 0) === Number(friedEgg);
                const sameOmelet = Number(item.omeletQty || 0) === Number(omelet);
                const sameNote = String(item.note || '').trim() === note;

                return sameFood && samePrice && sameFriedEgg && sameOmelet && sameNote;
            });

            if (existingIndex !== -1) {
                cart[existingIndex].qty = Number(cart[existingIndex].qty || 0) + Number(currentQty);
                if (cart[existingIndex].price !== null && cart[existingIndex].price !== undefined) {
                    cart[existingIndex].totalPrice = cart[existingIndex].price * cart[existingIndex].qty;
                }
            } else {
                cart.push({
                    item_id: Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                    food_id: foodId,
                    name: foodName,
                    price: finalPrice, 
                    base_price: price, 
                    friedEggQty: friedEgg,
                    omeletQty: omelet,
                    qty: currentQty,
                    note: note,
                    totalPrice: finalPrice !== null ? finalPrice * currentQty : null,
                    food_group_id: catId,
                    is_custom: price !== null,
                    isSpecialMenu: (String(catId) === '98')
                });
            }

            localStorage.setItem('cart', JSON.stringify(cart));

            // เปลี่ยนจากการสั่งปิดป๊อปอัปทันที (CLOSE_MODAL) เป็นการสั่งโหลดหน้าเลือกรายการอาหารเดิม (กลับไปภาพที่ 2)
            if (window.parent) {
                window.parent.postMessage({ type: 'UPDATE_CART', action: 'updateCart', cart: cart }, '*');
                
                // สั่งเปลี่ยน URL ของ Iframe ในป๊อปอัปให้ถอยกลับมาที่หน้ารายการอาหาร (ภาพที่ 2) แทนการปิดป๊อปอัป
                window.location.href = `selectfood.html?group_id=${catId}`;
            }
        }

        window.addEventListener('load', sendAutoHeight);
        
        window.addEventListener('message', (e) => {
            if (!e.data) return;
            const type = e.data.type || e.data.action;
            if (type === 'UPDATE_CART' || type === 'CART_UPDATED' || type === 'REFRESH_CART') {
                renderSelectedCartList();
            }
        });
    </script>       
</body>
</html>
